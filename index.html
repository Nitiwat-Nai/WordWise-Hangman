<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordWise Hangman - เกมฝึกศัพท์</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- THEME & GLOBAL STYLES (Dark/Green Theme) --- */
        :root {
            --color-primary: #38C172; /* Bright Green - For emphasis, score, correct */
            --color-secondary: #42A5F5; /* Blue - For keyboard keys */
            --color-correct: #38C172; 
            --color-wrong: #EF5350; /* Red */
            --color-bg: #2C3E50; /* Dark Blue Gray */
            --color-card: #34495E; /* Slightly Lighter Dark Gray */
            --color-text-dark: #ECF0F1; /* Light Text */
            --color-text-light: #FFFFFF;
            --color-hint-bg: #223040; /* Very Dark Blue for Hint Box */
            --color-hint-border: #F1C40F; /* Gold accent for hint border */
            --color-hangman-wood: #7F8C8D; /* Light Gray/Silver for gallows */
            --color-hangman-rope: #BDC3C7; /* Lighter Gray */
            --color-hangman-body: #F1C40F; /* Gold/Yellow body (similar to image) */
            --color-auto-active: #E74C3C; /* Red for active secret mode */
        }

        /* Responsive Container */
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #263340; /* Slightly lighter BG for better contrast */
            color: var(--color-text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 480px; /* Slimmer max-width for modern mobile feel */
            box-sizing: border-box;
            background-color: var(--color-card);
            /* ENHANCEMENT: Modern box shadow */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 5px 15px rgba(0, 0, 0, 0.3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 0;
        }

        /* Header */
        header {
            background-color: var(--color-hint-bg); 
            color: var(--color-primary);
            padding: 1rem 1rem; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            margin-bottom: 0.5rem; 
            position: sticky; /* Keep header visible */
            top: 0;
            z-index: 10;
        }
        header h1 {
            font-size: 1.8rem;
            margin: 0;
            cursor: pointer; 
            transition: color 0.2s;
            user-select: none; /* ENHANCEMENT: Prevent text selection on double-click */
        }
        /* Style when secret mode is active */
        header h1.robot-active {
            animation: pulse 1s infinite alternate;
        }
        
        @keyframes pulse {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(1.03); opacity: 0.8; }
        }

        /* Screen Management */
        .screen {
            padding: 0.5rem 1rem; 
            display: none; 
            flex-grow: 1;
            flex-direction: column;
        }
        .screen.active {
            display: flex;
            justify-content: space-between;
        }
        
        /* --- Start/End Screen --- */
        .start-screen {
            padding-top: 1rem;
        }
        .start-screen h2 {
            font-size: 2rem;
            color: var(--color-primary);
            margin-bottom: 0.5rem; 
        }
        .start-screen p {
            font-size: 1.1rem;
            margin-bottom: 1rem; 
            color: var(--color-text-dark);
        }
        .start-screen .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 95%; /* Slightly wider buttons */
            max-width: 400px;
            margin: 0 auto 0.5rem; 
            overflow-y: auto; 
            max-height: 60vh;
            padding: 0 5px;
        }
        .main-btn {
            background-color: var(--color-secondary);
            color: var(--color-text-light);
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #3188d6;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .main-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3188d6;
        }
        .main-btn.btn-random {
            background-color: var(--color-primary);
            box-shadow: 0 4px 0 #32A860;
        }
        .main-btn.btn-random:active {
            box-shadow: 0 2px 0 #32A860;
        }
        .main-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* --- Game Screen Components --- */
        #status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 1rem; 
            padding: 0 0.5rem;
            color: var(--color-text-dark);
        }

        /* Hangman and Word Area */
        #hangman-word-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 0.5rem; 
            padding: 0.5rem; 
            flex-grow: 1; /* ENHANCEMENT: Let this area take max vertical space */
            justify-content: center; /* Center content vertically within its expanded space */
        }
        
        #hangman-svg {
            /* ENHANCEMENT: Use VW for responsiveness */
            width: 35vw; 
            max-width: 180px; 
            height: 35vw;
            max-height: 180px;
            margin-bottom: 0.5rem; 
            overflow: visible; 
            background-color: #223040; 
            border-radius: 10px;
            padding: 10px;
        }
        #hangman-svg line, #hangman-svg circle, #hangman-svg path {
            stroke: var(--color-hangman-wood);
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke-dashoffset 0.5s ease-out; 
        }
        .hangman-part {
            stroke: var(--color-hangman-body);
            stroke-width: 3;
            fill: none;
        }
        .hangman-part.head {
            fill: var(--color-hangman-body);
            stroke: none;
        }


        /* Word Display */
        #word-display {
            display: flex; 
            justify-content: center;
            gap: 10px; 
            font-size: 2.8rem; 
            font-weight: 900;
            margin-bottom: 0.5rem; 
            color: var(--color-primary); 
            line-height: 1.2; 
        }
        .letter-slot {
            display: flex; 
            justify-content: center;
            align-items: flex-end; 
            width: 1.2ch; 
            text-align: center;
            box-sizing: border-box;
            padding-bottom: 5px; 
        }
        .letter-slot.placeholder {
            border-bottom: 5px solid var(--color-primary); 
            color: transparent; 
            font-weight: 900;
        }
        .letter-slot:not(.placeholder) {
             border-bottom: 5px solid transparent; 
        }
        

        /* Hint Box */
        #hint-box {
            background-color: var(--color-hint-bg);
            border: 2px solid var(--color-hint-border);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.75rem; /* ENHANCEMENT: Slightly reduced margin */
            text-align: left;
            font-size: 0.95rem;
            color: var(--color-text-dark);
            min-height: 50px; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hint-item {
            margin-bottom: 0.5rem;
        }
        .hint-label {
            font-weight: bold;
            color: var(--color-primary);
            margin-right: 5px;
        }

        /* Hint Button */
        #show-hint-btn {
            background-color: #FFB74D; 
            color: var(--color-text-dark);
            border: none;
            padding: 0.5rem 1rem; 
            border-radius: 8px;
            font-size: 1rem; 
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #FF9800;
            transition: transform 0.1s, box-shadow 0.1s;
            display: inline-block;
        }
        #show-hint-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #FF9800;
        }
        #show-hint-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        #hint-meaning-display {
            font-style: italic;
            color: #BDC3C7; 
            min-height: 20px; 
            display: none; 
        }
        #hint-meaning-container {
             display: block;
        }
        
        /* Keyboard (ลด Padding ด้านล่าง) */
        #keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px; /* ENHANCEMENT: Slightly reduced gap */
            padding: 0 0.5rem 0.5rem; 
        }

        .key-btn {
            background-color: var(--color-secondary);
            color: var(--color-text-light);
            border: none;
            padding: 0.7rem 0.2rem;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #3188d6;
            transition: all 0.1s;
        }

        .key-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #3188d6;
        }

        .key-btn.correct {
            background-color: var(--color-correct);
            box-shadow: 0 3px 0 #32A860;
        }

        .key-btn.wrong {
            background-color: var(--color-wrong);
            box-shadow: 0 3px 0 #C62828;
        }

        .key-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        /* ปุ่มยอมแพ้ (ปรับลด Margin-top) */
        #give-up-btn {
            margin-top: 0.5rem !important; 
        }

        /* --- End Game Screen --- */
        #end-screen {
            justify-content: center; 
            padding-top: 2rem;
        }
        #end-screen h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        #end-screen p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        #word-review {
            text-align: left;
            margin-top: 1rem;
            background-color: var(--color-hint-bg);
            border: 1px solid var(--color-hangman-wood);
            padding: 1rem;
            border-radius: 10px;
        }
        #word-review .word-result {
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--color-primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
        }
        #word-review .meaning {
             margin-left: 10px;
             font-weight: normal;
             font-size: 1.1rem;
             color: var(--color-text-dark);
        }
        /* New button style for final pronounce */
        .pronounce-final-btn {
            background: none;
            border: none;
            color: var(--color-secondary);
            font-weight: bold;
            cursor: pointer;
            font-size: 1.8rem;
            margin-left: 10px;
        }
        
        /* จัดปุ่มใน End Screen ให้อยู่ในแนวนอน */
        .end-button-group {
            display: flex;
            justify-content: space-between; 
            gap: 10px;
            width: 100%; 
            max-width: 450px; 
            margin: 2rem auto 0;
            padding: 0 1rem;
            box-sizing: border-box;
        }
        .btn-restart {
            background-color: var(--color-primary);
            box-shadow: 0 5px 0 #32A860;
            width: 50%; 
            margin-top: 0 !important; 
        }
        .btn-back-home {
            background-color: #6A7A7B; 
            box-shadow: 0 5px 0 #576364; 
            width: 50%; 
            margin-top: 0 !important; 
        }
        
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <header>
            <h1 id="game-title">WordWise Hangman</h1>
        </header>

        <div id="start-screen" class="screen active start-screen">
            <h2>ยินดีต้อนรับสู่ Hangman ฝึกศัพท์!</h2>
            <p>เลือกหมวดหมู่เพื่อเริ่มเล่น:</p>
            <div class="btn-group" id="category-selection">
                </div>
        </div>

        <div id="game-screen" class="screen">
            <div id="status-bar">
                <span id="category-title">หมวดหมู่:</span>
                <span id="lives-left">โอกาส: 8</span>
                <span id="score">คะแนน: 0/0</span> 
            </div>

            <div id="hangman-word-area">
                
                <svg id="hangman-svg" viewBox="0 0 200 200">
                    
                    <line x1="10" y1="190" x2="190" y2="190" stroke-width="6" stroke="var(--color-hangman-wood)" /> 
                    <line x1="50" y1="190" x2="50" y2="10" stroke-width="6" stroke="var(--color-hangman-wood)" /> 
                    <line x1="50" y1="10" x2="140" y2="10" stroke-width="6" stroke="var(--color-hangman-wood)" /> 
                    <line x1="140" y1="10" x2="140" y2="40" stroke-width="4" stroke="var(--color-hangman-rope)" /> 

                    <g id="hangman-figure">
                        <circle id="head" cx="140" cy="60" r="20" class="hangman-part" style="display:none;" />
                        <line id="body" x1="140" y1="80" x2="140" y2="130" class="hangman-part" style="display:none;" />
                        <line id="left-arm" x1="140" y1="90" x2="110" y2="110" class="hangman-part" style="display:none;" />
                        <line id="right-arm" x1="140" y1="90" x2="170" y2="110" class="hangman-part" style="display:none;" />
                        <line id="left-leg" x1="140" y1="130" x2="120" y2="160" class="hangman-part" style="display:none;" />
                        <line id="right-leg" x1="140" y1="130" x2="160" y2="160" class="hangman-part" style="display:none;" />
                        
                        <g id="left-eye" class="hangman-part" style="display:none;">
                            <line x1="128" y1="52" x2="136" y2="58" stroke="var(--color-wrong)" stroke-width="2"/>
                            <line x1="128" y1="58" x2="136" y2="52" stroke="var(--color-wrong)" stroke-width="2"/>
                        </g>
                        <g id="right-eye" class="hangman-part" style="display:none;">
                            <line x1="144" y1="52" x2="152" y2="58" stroke="var(--color-wrong)" stroke-width="2"/>
                            <line x1="144" y1="58" x2="152" y2="52" stroke="var(--color-wrong)" stroke-width="2"/>
                        </g>

                    </g>
                </svg>
                <div id="word-display"></div>
            </div>

            <div id="hint-box">
                <div class="hint-item" style="margin-bottom: 0.5rem;">
                    <span class="hint-label">คำใบ้:</span> 
                    <span id="hint-meaning-container" style="min-height: 20px; display: block;">
                         <button id="show-hint-btn" class="hint-inline-btn">แสดงคำใบ้ (1 ครั้ง)</button>
                        <span id="hint-meaning-display" style="font-style: italic; color: #BDC3C7; display:none;"></span>
                    </span>
                </div>
                <div class="hint-item" id="example-sentence-container" style="margin-bottom: 0;">
                    <span class="hint-label">ตัวอย่างประโยค:</span> 
                    <span id="hint-example"></span>
                </div>
            </div>

            <div id="keyboard">
                </div>
            
            <button id="give-up-btn" class="main-btn" style="background-color: #7F8C8D; box-shadow: 0 5px 0 #6A7A7B; width: 100%; margin-top: 0.5rem;">
                ยอมแพ้ / กลับหน้าหลัก
            </button>
        </div>
        
        <div id="end-screen" class="screen start-screen">
            <div class="end-content">
                <h2 id="end-message"></h2>
                <p id="end-details"></p>
                
                <div id="word-review">
                    <div class="word-result">
                        คำศัพท์ที่ถูกต้องคือ: 
                        <span id="final-word-reveal" class="meaning" style="font-size: 1.8rem; color: var(--color-primary);"></span>
                        <button id="final-pronounce-btn" title="กดเพื่อฟังการออกเสียง" class="pronounce-final-btn">🔊</button>
                    </div>
                    <div class="word-result" style="color: var(--color-text-dark); margin-left: 0.5rem;">
                        <span id="final-meaning-reveal" class="meaning" style="margin-left: 0;"></span>
                    </div>
                </div>
                
                <div class="end-button-group">
                    <button id="restart-btn" class="main-btn btn-restart">โหลด...</button> 
                    <button id="back-home-btn" class="main-btn btn-back-home">
                        กลับหน้าหลัก
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA (10 Categories x 10 Words + 1 Random Category x 20 Words = 120 words) ---
        const wordData = [
            // Category 1: FRUIT (10 Words)
            { word: "FIG", category: "ผลไม้", descriptiveHint: "ผลไม้เล็กๆ มีเปลือกสีเขียวหรือม่วง และมีเมล็ดเล็กๆ อยู่ข้างใน", pos: "(N.)", example: "I had a dried fig for breakfast." },
            { word: "LIME", category: "ผลไม้", descriptiveHint: "ผลไม้รสเปรี้ยว มีเปลือกสีเขียว มักใช้ผสมเครื่องดื่ม", pos: "(N.)", example: "She squeezed a fresh lime into her water." },
            { word: "KIWI", category: "ผลไม้", descriptiveHint: "ผลไม้เล็กๆ มีขนปกคลุมข้างนอก เนื้อด้านในสีเขียวสดใส", pos: "(N.)", example: "A slice of kiwi is a great addition to the fruit salad." },
            { word: "GRAPE", category: "ผลไม้", descriptiveHint: "ผลไม้ลูกเล็กๆ เป็นพวง มักใช้ในการผลิตไวน์", pos: "(N.)", example: "I bought a bunch of sweet green grape." },
            { word: "MANGO", category: "ผลไม้", descriptiveHint: "ผลไม้เขตร้อนที่มีรสชาติหวานฉ่ำ เปลือกสีเหลืองหรือเขียว", pos: "(N.)", example: "A ripe mango is very sweet and juicy." },
            { word: "APPLE", category: "ผลไม้", descriptiveHint: "ผลไม้สีแดงหรือเขียว ทรงกลม เป็นที่รู้จักกันดีว่ามีประโยชน์ต่อสุขภาพ", pos: "(N.)", example: "An apple a day keeps the doctor away." },
            { word: "PEACH", category: "ผลไม้", descriptiveHint: "ผลไม้มีขนอ่อนๆ ปกคลุม มีเมล็ดขนาดใหญ่ตรงกลาง เนื้อสีส้มเหลือง", pos: "(N.)", example: "She took a bite of the soft, sweet peach." },
            { word: "ORANGE", category: "ผลไม้", descriptiveHint: "ผลไม้รสหวานอมเปรี้ยว มีเปลือกสีส้ม และมีวิตามินซีสูง", pos: "(N.)", example: "Drinking orange juice is a good way to start the day." },
            { word: "BANANA", category: "ผลไม้", descriptiveHint: "ผลไม้รูปร่างยาวโค้ง เปลือกสีเหลือง เป็นแหล่งพลังงานที่ดี", pos: "(N.)", example: "Monkeys love to eat a yellow banana." },
            { word: "CHERRY", category: "ผลไม้", descriptiveHint: "ผลไม้เล็กๆ สีแดงสด รสชาติหวานหรือเปรี้ยว มักใช้ตกแต่งเค้ก", pos: "(N.)", example: "The cake was topped with a bright red cherry." },
            
            // Category 2: TRAVEL (10 Words)
            { word: "BUS", category: "การเดินทาง", descriptiveHint: "ยานพาหนะขนาดใหญ่ที่ใช้ขนส่งผู้โดยสารในระยะทางสั้นๆ หรือในเมือง", pos: "(N.)", example: "I take the bus to work every morning." },
            { word: "MAP", category: "การเดินทาง", descriptiveHint: "แผ่นภาพแสดงพื้นที่และเส้นทางภูมิศาสตร์ ใช้หาทิศทาง", pos: "(N.)", example: "We used a paper map to navigate the city." },
            { word: "TRIP", category: "การเดินทาง", descriptiveHint: "การเดินทางสั้นๆ หรือการท่องเที่ยวพักผ่อน", pos: "(N.)", example: "We are planning a short weekend trip to the beach." },
            { word: "BOAT", category: "การเดินทาง", descriptiveHint: "ยานพาหนะขนาดเล็กถึงกลางที่ลอยน้ำ ใช้เดินทางข้ามน้ำ", pos: "(N.)", example: "We rented a small boat for fishing on the lake." },
            { word: "HOTEL", category: "การเดินทาง", descriptiveHint: "สถานที่ให้บริการห้องพักสำหรับนักเดินทางเพื่อพักค้างคืน", pos: "(N.)", example: "We stayed in a five-star hotel near the ocean." },
            { word: "FLIGHT", category: "การเดินทาง", descriptiveHint: "การเดินทางจากที่หนึ่งไปอีกที่หนึ่งโดยใช้เครื่องบิน", pos: "(N.)", example: "Our flight was delayed due to bad weather." },
            { word: "TICKET", category: "การเดินทาง", descriptiveHint: "เอกสารที่ให้สิทธิ์ในการเดินทาง, เข้าชม, หรือเข้าใช้บริการ", pos: "(N.)", example: "Don't forget your train ticket before you board." },

        // --- HANGMAN SVG PARTS (IDs of the SVG elements to show) ---
        const hangmanSvgParts = [
            "head", "body", "left-arm", "right-arm", "left-leg", "right-leg", "left-eye", "right-eye"
        ];
        
        const MAX_LIVES = hangmanSvgParts.length; // Total wrong guesses allowed (8)
        
        // --- ELEMENTS ---
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        
        const gameTitleEl = document.getElementById('game-title'); // NEW
        const categorySelection = document.getElementById('category-selection');
        const categoryTitleEl = document.getElementById('category-title');
        const livesLeftEl = document.getElementById('lives-left');
        const scoreEl = document.getElementById('score');
        
        const wordDisplay = document.getElementById('word-display');
        const keyboardEl = document.getElementById('keyboard');

        const finalMeaningRevealEl = document.getElementById('final-meaning-reveal');
        const finalPronounceBtn = document.getElementById('final-pronounce-btn'); 
        const restartBtn = document.getElementById('restart-btn');
        const backHomeBtn = document.getElementById('back-home-btn'); 
        

        // --- GAME STATE ---
        let lives = MAX_LIVES;
        let currentWord = '';
        let currentWordDetails = null;
        let guessedLetters = new Set();
        let currentCategory = '';
        let totalScore = 0; // Correct words in this session
        
        let wordQueue = []; // คิวคำศัพท์สำหรับเซสชั่นปัจจุบัน (กันซ้ำ)
        let currentWordIndex = 0; // ดัชนีคำศัพท์ในคิว
        let hintUsed = false; 
        
        let autoAdvanceTimeout; // Global timeout variable for end screen speech/delay
        
        // --- AUTO-SOLVE STATE (NEW) ---
        let isAutoModeActive = false; // Secret mode toggle
        let isAutoSolving = false; // Flag to indicate auto-solve is currently running
        let autoSolveTimeoutId = null; // Timer ID for the auto-solve delay
        let lettersToRevealQueue = []; // Queue of letters for the auto-solve

        // --- UTILITY (Audio & Speech) ---
        let audioContext;
        let voices = [];
        
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function setupSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    voices = window.speechSynthesis.getVoices();
                };
            }
        }
        
        function getVoice(lang) {
             return voices.find(v => v.lang.startsWith('en-US') && (v.name.includes('Samantha') || v.name.includes('Google US English'))) || voices.find(v => v.lang.startsWith('en')) || null;
        }

        /**
         * Function to speak text and return the utterance object for tracking
         */
        function speakText(text, lang) {
            if (!('speechSynthesis' in window)) return null;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.7; 
            utterance.volume = 1;

            const targetVoice = getVoice(lang);
            if (targetVoice) {
                utterance.voice = targetVoice;
            }

            window.speechSynthesis.speak(utterance);
            return utterance; // Return the object
        }

        function createTone(frequency, duration, type, volume = 0.5) {
            initAudioContext();
            if (!audioContext || audioContext.state === 'suspended') return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination); 

            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            oscillator.type = type; 

            gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + duration);

            oscillator.start();
            oscillator.stop(audioContext.currentTime + duration);
        }

        function playPing() { createTone(880, 0.15, 'sine', 0.8); }
        function playFailTone() { createTone(150, 0.4, 'triangle', 0.7); }
        
        // --- Core Helpers ---
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        function drawHangman(livesLeft) {
            hangmanSvgParts.forEach(partId => {
                const part = document.getElementById(partId);
                if (part) part.style.display = 'none';
            });

            const partsLost = MAX_LIVES - livesLeft;
            for (let i = 0; i < partsLost; i++) {
                const part = document.getElementById(hangmanSvgParts[i]);
                if (part) part.style.display = 'block';
            }
        }

        function updateWordDisplay(revealFullWord = false) {
            let solved = true;
            const normalizedWord = currentWord.toUpperCase();
            wordDisplay.innerHTML = ''; 

            for (const letter of normalizedWord) {
                const span = document.createElement('span');
                span.classList.add('letter-slot');

                if (letter === ' ') {
                    span.textContent = ' ';
                    span.style.borderBottom = 'none'; 
                    span.style.minWidth = '1ch'; 
                } else if (revealFullWord || guessedLetters.has(letter)) {
                    span.textContent = letter;
                    span.style.borderBottom = '5px solid transparent'; 
                } else {
                    span.textContent = ' '; 
                    span.classList.add('placeholder');
                    span.style.borderBottom = '5px solid var(--color-primary)'; 
                    solved = false;
                }
                
                wordDisplay.appendChild(span);
            }
            return solved;
        }

        function generateKeyboard() {
            keyboardEl.innerHTML = '';
            for (let i = 65; i <= 90; i++) {
                const char = String.fromCharCode(i);
                const btn = document.createElement('button');
                btn.textContent = char;
                btn.className = 'key-btn';
                btn.setAttribute('data-char', char);
                btn.addEventListener('click', () => handleGuess(char));
                
                // Re-apply styles if already guessed 
                if (guessedLetters.has(char)) {
                    btn.disabled = true;
                    // Check against the current word
                    if (currentWord.includes(char)) {
                        btn.classList.add('correct');
                    } else {
                        btn.classList.add('wrong');
                    }
                }
                
                keyboardEl.appendChild(btn);
            }
            // Keyboard is NOT hidden in auto-solve mode now
        }
        
        function updateKeyboard(char, isCorrect) {
            // Update key appearance regardless of mode
            const btn = keyboardEl.querySelector(`[data-char="${char}"]`);
            if (btn) {
                btn.disabled = true;
                
                // In Auto-Solve, the system only guesses CORRECT letters from the queue
                // So we force 'correct' in auto mode, and use the guess result in manual mode
                if (isAutoModeActive) {
                    btn.classList.add('correct');
                    btn.classList.remove('wrong'); 
                } else {
                    btn.classList.add(isCorrect ? 'correct' : 'wrong');
                }
            }
        }

        function handleGuess(char) {
            // Prevent manual interaction if auto-solve is running (prevents race condition)
            if (isAutoSolving) return; 
            
            const charUpper = char.toUpperCase();
            
            // Check if already guessed
            if (guessedLetters.has(charUpper)) return;

            guessedLetters.add(charUpper);
            
            if (currentWord.includes(charUpper)) {
                updateKeyboard(charUpper, true);
                const solved = updateWordDisplay();
                
                playPing();
                
                if (solved) {
                    totalScore++; // Manual score update
                    scoreEl.textContent = `คะแนน: ${totalScore}/${wordQueue.length}`;
                    
                    // Manual win flow: Disable buttons and go to end screen
                    keyboardEl.querySelectorAll('.key-btn').forEach(btn => btn.disabled = true);
                    showHintBtn.disabled = true;
                    giveUpBtn.disabled = true;
                    
                    // **FIX #2:** Show word on game screen for 0.5s before going to End Screen
                    setTimeout(() => {
                        endGame(true); 
                    }, 500); 
                    
                }
            } else {
                // Manual loss flow
                lives--;
                updateKeyboard(charUpper, false);
                drawHangman(lives);
                livesLeftEl.textContent = `โอกาส: ${lives}`;
                
                playFailTone();
                
                if (lives <= 0) {
                    // Loss flow: Disable buttons and go to end screen
                    keyboardEl.querySelectorAll('.key-btn').forEach(btn => btn.disabled = true);
                    showHintBtn.disabled = true;
                    giveUpBtn.disabled = true;
                    
                    // Add delay for consistency on the loss screen as well.
                    setTimeout(() => {
                         endGame(false); // Loss
                    }, 500); 
                    
                    return; 
                }
            }
            scoreEl.textContent = `คะแนน: ${totalScore}/${wordQueue.length}`;
        }
        
        // --- AUTO-SOLVE LOGIC ---
        
        function stopAutoSolve() {
            if (autoSolveTimeoutId) {
                clearTimeout(autoSolveTimeoutId);
                autoSolveTimeoutId = null;
            }
            isAutoSolving = false;
        }

        /**
         * Function that performs the single letter revelation step
         */
        function autoSolveLetter(char) {
            const charUpper = char.toUpperCase();
            
            // 1. Add and process the letter
            if (!guessedLetters.has(charUpper)) {
                guessedLetters.add(charUpper);
                updateKeyboard(charUpper, true); 
            }
            
            // 2. Update display
            const solved = updateWordDisplay(); 
            playPing(); 
            
            if (solved) {
                // Word solved. Stop the loop, add score, and go to End Screen (Req #3)
                stopAutoSolve(); 
                totalScore++; // Update score
                scoreEl.textContent = `คะแนน: ${totalScore}/${wordQueue.length}`; 
                
                // **FIX #2:** Go to End Screen after 0.5s delay
                 setTimeout(() => {
                    endGame(true); 
                 }, 500);
                 
            } else {
                // If not solved, schedule the next letter
                if (isAutoSolving) {
                    autoSolveLoop(); // Recursive call to schedule the next one
                }
            }
        }
        
        /**
         * Schedules the next letter revelation with a random delay
         */
        function autoSolveLoop() {
            if (lettersToRevealQueue.length === 0 || !isAutoSolving) {
                return;
            }

            const nextLetter = lettersToRevealQueue.shift();
            // Random delay between 800ms and 1000ms (0.8s - 1.0s)
            const delay = Math.random() * (1000 - 800) + 800; 
            
            autoSolveTimeoutId = setTimeout(() => {
                 autoSolveLetter(nextLetter); 
            }, delay);
        }
        
        /**
         * Initializes the auto-solve sequence for a new word
         */
        function startAutoSolve() {
            if (!isAutoModeActive) return;

            // 1. Identify all unique letters not yet guessed
            const uniqueLetters = new Set();
            for (const letter of currentWord) {
                const char = letter.toUpperCase();
                // We only care about letters A-Z
                if (char >= 'A' && char <= 'Z' && !guessedLetters.has(char)) {
                    uniqueLetters.add(char);
                }
            }
            
            lettersToRevealQueue = Array.from(uniqueLetters);
            shuffle(lettersToRevealQueue); // Shuffle for random order as requested
            
            // If the word has no letters to guess (already revealed, or only spaces)
            if (lettersToRevealQueue.length === 0) {
                totalScore++;
                scoreEl.textContent = `คะแนน: ${totalScore}/${wordQueue.length}`;
                setTimeout(() => endGame(true), 500); 
                return;
            }

            // 2. Start the continuous loop
            isAutoSolving = true;
            autoSolveLoop();
        }


        // --- GAME FLOW & UI ---
        
        function clearAutoAdvance() {
             // Clear the word-to-word advance timer 
             if (autoAdvanceTimeout) {
                 clearTimeout(autoAdvanceTimeout);
                 autoAdvanceTimeout = null;
             }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(id).classList.add('active');
            window.speechSynthesis.cancel();
            clearAutoAdvance(); 
        }
        
        /**
         * **FIXED:** Function to handle pronunciation and 2-second delay auto-advance
         */
        function handleEndScreenAdvance() {
            const totalDelay = 4500; // Fixed total delay (e.g., Speech ~2.5s + Pause 2.0s)

            // 1. Start Pronunciation immediately
            speakText(currentWordDetails.word, 'en-US');
            
            // 2. Disable buttons while waiting for auto-advance
            restartBtn.disabled = true; 
            backHomeBtn.disabled = true;

            // 3. Schedule the advance after the fixed delay
            autoAdvanceTimeout = setTimeout(() => {
                 window.speechSynthesis.cancel(); // Stop any residual speech
                 currentWordIndex++; // Advance index
                 showScreen('game-screen'); 
                 loadNextWord(); // Load next word
            }, totalDelay); 
        }

        function startSession(category) {
            currentCategory = category;
            
            let availableWords;
            const allCategoryName = "สุ่มรวมทุกหมวด";
            const randomMixInternalName = "สุ่ม 20 คำ (Random Mix)"; 

            // FIX: Correctly filter words 
            if (category === allCategoryName) {
                // Get ALL words (120 total)
                availableWords = wordData; 
            } else {
                // Get words ONLY from the selected category
                availableWords = wordData.filter(d => d.category === category);
            }

            // Remove duplicates and Shuffle 
            const uniqueWords = [...new Set(availableWords)];

            if (uniqueWords.length === 0) {
                alert("No words available for this category!");
                showScreen('start-screen');
                return;
            }

            wordQueue = uniqueWords;
            shuffle(wordQueue);
            currentWordIndex = 0;
            totalScore = 0;
            
            showScreen('game-screen'); 

            loadNextWord(); 
        }
        
        function loadNextWord() {
            if (currentWordIndex >= wordQueue.length) {
                endSession(true); 
                return;
            }
            
            // 1. Select the word
            currentWordDetails = wordQueue[currentWordIndex];
            currentWord = currentWordDetails.word.toUpperCase(); 

            // 2. Reset game state for this word
            lives = MAX_LIVES;
            guessedLetters.clear();
            hintUsed = false; 
            stopAutoSolve(); 

            // 3. Update UI
            drawHangman(lives); 
            updateWordDisplay();
            generateKeyboard(); 
            
            categoryTitleEl.textContent = `หมวดหมู่: ${currentCategory}`;
            livesLeftEl.textContent = `โอกาส: ${lives}`;
            scoreEl.textContent = `คะแนน: ${totalScore}/${wordQueue.length}`;
            
            // 4. Update Hints (Reset & **BUG FIX 1**)
            hintMeaningDisplayEl.textContent = `(${currentWordDetails.pos}) ${currentWordDetails.descriptiveHint}`; 
            hintMeaningDisplayEl.style.display = 'none'; 
            showHintBtn.style.display = 'inline-block'; // BUG FIX: Ensure button is visible
            showHintBtn.disabled = false; 
            
            const blankedExample = currentWordDetails.example.replace(new RegExp(currentWordDetails.word, 'gi'), '___');
            hintExampleEl.textContent = blankedExample;
            
            // 5. Ensure buttons are visible/enabled 
            giveUpBtn.style.display = 'block'; 
            giveUpBtn.disabled = false;

            // 6. Start auto-solve if active
            if (isAutoModeActive) {
                startAutoSolve();
            }
        }

        function endGame(isWin) {
            stopAutoSolve(); 
            window.speechSynthesis.cancel(); // Cancel any current speech

            const hasNext = (currentWordIndex + 1) < wordQueue.length;
            
            // 1. Reveal the full word (for display)
            updateWordDisplay(true); 
            
            // 2. Handle score and message
            if (isAutoModeActive) {
                endMessageEl.textContent = hasNext ? "✅ เฉลยคำศัพท์เสร็จสมบูรณ์" : "🥳 จบเซสชั่น! สรุปผลการเฉลยอัตโนมัติ";
                endMessageEl.style.color = 'var(--color-correct)'; 
            } else {
                endMessageEl.textContent = isWin ? "🥳 ยอดเยี่ยม! คุณชนะแล้ว!" : "😭 น่าเสียดาย! คุณแพ้แล้ว!";
                endMessageEl.style.color = isWin ? 'var(--color-correct)' : 'var(--color-wrong)';
            }
            
            endDetailsEl.textContent = `คำที่ ${currentWordIndex + 1}/${wordQueue.length} | คะแนนรวม: ${totalScore} คำ`;
            
            // 3. Reveal final word details
            finalWordRevealEl.textContent = currentWordDetails.word;
            finalMeaningRevealEl.innerHTML = `(${currentWordDetails.pos}) ${currentWordDetails.descriptiveHint}.<br>ตัวอย่าง: ${currentWordDetails.example}`; 
            
            // 4. Update buttons for end screen
            restartBtn.textContent = hasNext ? `เล่นข้อต่อไป >> (${currentWordIndex + 2} / ${wordQueue.length})` : "จบเซสชั่น / กลับหน้าหลัก"; 
            restartBtn.disabled = false;
            backHomeBtn.disabled = false;
            backHomeBtn.style.display = 'block'; 

            // Re-bind click handlers for manual flow (The handler is only triggered if auto-advance is NOT active)
            restartBtn.removeEventListener('click', restartBtnManualHandler);
            restartBtn.removeEventListener('click', endSession);
            
            // If it's the last word, the button always leads home
            if(!hasNext) {
                 restartBtn.addEventListener('click', endSession);
            } else {
                 // For next word, use the manual handler
                 restartBtn.addEventListener('click', restartBtnManualHandler);
            }
            
            showScreen('end-screen');
            
            // 5. Handle pronunciation and Auto Advance
            if (currentWordDetails && currentWordDetails.word) {
                const shouldAutoAdvance = isWin && hasNext && isAutoModeActive;
                
                if (shouldAutoAdvance) {
                    // Auto Advance mode: FIXED - Only call this function for smooth speech + transition.
                    handleEndScreenAdvance();
                } else {
                    // Manual mode: Read the word after a short delay for stability.
                    setTimeout(() => {
                        speakText(currentWordDetails.word, 'en-US');
                    }, 50); // 50ms delay
                }
            }
        }

        // จัดการเมื่อเซสชั่นจบ
        function endSession(isFinished = false) {
             window.speechSynthesis.cancel();
             clearAutoAdvance(); 
             stopAutoSolve(); 
             
             // Reset robot mode visual state
             isAutoModeActive = false;
             gameTitleEl.classList.remove('robot-active');
             
             wordQueue = []; 
             currentWordIndex = 0;
             totalScore = 0; // Reset total score for next session
             showScreen('start-screen');
        }
        
        function setupCategoryButtons() {
            // Get unique category names excluding the internal Random Mix category
            const randomMixInternalName = "สุ่ม 20 คำ (Random Mix)";
            const categoriesForButton = [...new Set(wordData.map(d => d.category))].filter(cat => cat !== randomMixInternalName);

            categorySelection.innerHTML = '';
            
            categoriesForButton.forEach(category => {
                // Only count words in that specific category
                const count = wordData.filter(d => d.category === category).length;
                const btn = document.createElement('button');
                btn.className = 'main-btn';
                btn.textContent = `${category} (${count} คำ)`;
                btn.setAttribute('data-category', category);
                btn.addEventListener('click', () => startSession(category));
                categorySelection.appendChild(btn);
            });
            
            // Add "Random from ALL" button
            const totalWords = wordData.length;
            const allCategoryName = "สุ่มรวมทุกหมวด";
            const randomBtn = document.createElement('button');
            randomBtn.className = 'main-btn btn-random';
            randomBtn.textContent = `${allCategoryName} (All Words Mix: ${totalWords} คำ)`;
            
            randomBtn.addEventListener('click', () => startSession(allCategoryName)); 
            
            categorySelection.appendChild(randomBtn);
        }
        
        // Manual Play Next Word Handler (used when auto-advance is not running/needed)
        function restartBtnManualHandler() {
             window.speechSynthesis.cancel();
             clearAutoAdvance(); 
             
             // This is for manual flow's end screen click
             currentWordIndex++; 
             if (currentWordIndex < wordQueue.length) {
                 showScreen('game-screen'); 
                 loadNextWord();
             } else {
                 // End of session, redirect to home
                 endSession();
             }
        }
        
        // --- EVENT LISTENERS ---
        
        // **BUG FIX 1:** Hint Button Logic
        showHintBtn.addEventListener('click', () => {
            if (!hintUsed) {
                hintUsed = true;
                showHintBtn.disabled = true;
                showHintBtn.style.display = 'none'; // Hide the button
                hintMeaningDisplayEl.style.display = 'block'; // Show the hint text
            }
        });
        
        // Double-click/Double-tap on Game Title for Secret Mode
        gameTitleEl.addEventListener('dblclick', () => {
             stopAutoSolve(); 
             
             // Toggle mode
             isAutoModeActive = !isAutoModeActive;
             // **FIX #3:** Only toggle the class, the color is now inherited
             gameTitleEl.classList.toggle('robot-active', isAutoModeActive);
            
            if (isAutoModeActive) {
                alert("🤖 โหมดเฉลยอัตโนมัติเปิดใช้งานแล้ว! ระบบจะทำการเฉลยคำศัพท์เมื่อเริ่มเกม");
                
                // If a game is currently active, start the auto-solve
                if (gameScreen.classList.contains('active')) {
                     loadNextWord(); // Re-load to start solve
                }
            } else {
                alert("👤 โหมดเฉลยอัตโนมัติปิดใช้งานแล้ว! กลับสู่การเล่นด้วยตัวเอง.");
                
                // If a game is currently active, re-enable manual interaction
                if (gameScreen.classList.contains('active')) {
                     loadNextWord(); // Re-load to enable UI
                }
            }
        });
        
        // Final Pronounce Button (manual click to listen again)
        finalPronounceBtn.addEventListener('click', () => {
             clearAutoAdvance(); 
             restartBtn.disabled = false; // Ensure buttons are clickable if auto advance was pending
             backHomeBtn.disabled = false;
             
             if (currentWordDetails && currentWordDetails.word) {
                 speakText(currentWordDetails.word, 'en-US');
             }
        });
        
        // Logic for Give Up Button (Manual/Auto to go back home)
        giveUpBtn.addEventListener('click', () => {
            if(confirm("คุณต้องการยอมแพ้และกลับสู่หน้าหลักหรือไม่?")) {
                endSession(); 
            }
        });
        
        // Back Home Button Listener (End Screen)
        backHomeBtn.addEventListener('click', () => {
            endSession();
        });


        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            setupSpeech();
            setupCategoryButtons();
            drawHangman(MAX_LIVES); 
            
            // Resume audio context on first user interaction (สำคัญสำหรับ Safari/Chrome)
            document.addEventListener('click', () => {
                initAudioContext();
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            }, { once: true });
        });
    </script>
</body>
</html>
