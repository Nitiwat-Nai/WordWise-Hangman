<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordWise Hangman - Modern Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- THEME & VARIABLES --- */
        :root {
            --primary-grad: linear-gradient(135deg, #00b09b, #96c93d);
            --secondary-grad: linear-gradient(135deg, #4facfe, #00f2fe);
            --danger-grad: linear-gradient(135deg, #ff5f6d, #ffc371);
            --hint-grad: linear-gradient(135deg, #f093fb, #f5576c);
            
            --color-correct: #2ecc71;
            --color-wrong: #e74c3c;
            --color-text-main: #ffffff;
            --color-text-secondary: #d1d5db;
            
            --bg-color: #1a202c;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow-soft: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: radial-gradient(circle at top right, #2d3748, #1a202c);
            color: var(--color-text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }

        /* --- CONTAINER WITH GLASSMORPHISM --- */
        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            box-sizing: border-box;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
        }

        /* --- HEADER --- */
        header {
            background: rgba(26, 32, 44, 0.8);
            backdrop-filter: blur(5px);
            padding: 1rem;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 800;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            user-select: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        /* Secret Mode Animation */
        header h1.robot-active {
            text-shadow: 0 0 10px rgba(150, 201, 61, 0.5);
            animation: pulse-glow 1.5s infinite alternate;
        }

        @keyframes pulse-glow {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.05); filter: brightness(1.3); }
        }

        /* --- SCREEN ANIMATIONS --- */
        .screen {
            padding: 1rem;
            display: none;
            flex-grow: 1;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
        }
        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Shake Animation */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* --- BUTTONS --- */
        .main-btn {
            background: var(--secondary-grad);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(66, 165, 245, 0.4);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .main-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 5px rgba(66, 165, 245, 0.2);
        }
        .main-btn.btn-random {
            background: var(--primary-grad);
            box-shadow: 0 4px 15px rgba(56, 193, 114, 0.4);
        }
        .main-btn:disabled {
            filter: grayscale(100%);
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- START SCREEN --- */
        .start-screen .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin: 1rem auto;
            overflow-y: auto;
            max-height: 65vh;
            padding: 5px;
        }
        .btn-group::-webkit-scrollbar { width: 6px; }
        .btn-group::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

        /* --- GAME SCREEN --- */
        #status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--color-text-secondary);
        }

        #hangman-word-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1rem;
            flex-grow: 1;
            justify-content: center;
        }
        #hangman-svg {
            width: 35vw; 
            max-width: 180px; 
            height: 35vw;
            max-height: 180px;
            margin-bottom: 0.5rem; 
            overflow: visible; 
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
        }
        #hangman-svg line, #hangman-svg circle, #hangman-svg path {
            stroke: #cbd5e0;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .hangman-part { stroke: #f6e05e !important; stroke-width: 4; }
        .hangman-part.head { fill: #f6e05e !important; stroke: none !important; }

        #word-display {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 1rem 0;
        }
        .letter-slot {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--color-text-main);
            border-bottom: 4px solid rgba(255,255,255,0.3);
            width: 1.2ch;
            text-align: center;
            height: 3rem;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transition: all 0.3s;
        }
        .letter-slot:not(.placeholder) {
            border-bottom-color: transparent;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #48bb78; 
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        #hint-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem; 
            text-align: left;
            font-size: 0.95rem;
            color: var(--color-text-secondary);
        }
        #show-hint-btn {
            background: var(--hint-grad);
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(240, 147, 251, 0.4);
        }

        #keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px; 
            padding: 0 5px 10px;
        }
        .key-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.8rem 0;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s;
        }
        .key-btn:active, .key-btn.simulated-press { 
            transform: scale(0.9); 
            background: rgba(255,255,255,0.2); 
        }
        .key-btn.correct { background: var(--color-correct); border-color: var(--color-correct); box-shadow: 0 0 10px rgba(46, 204, 113, 0.4); }
        .key-btn.wrong { background: var(--color-wrong); border-color: var(--color-wrong); opacity: 0.6; }
        
        #give-up-btn {
            background: transparent;
            border: 2px solid #e74c3c;
            color: #e74c3c;
            box-shadow: none;
            margin-top: 5px !important;
            padding: 0.6rem;
            font-size: 1rem;
        }
        #give-up-btn:active { background: rgba(231, 76, 60, 0.1); }

        /* --- END SCREEN --- */
        #end-screen {
            justify-content: center;
            text-align: center;
            padding-top: 2rem;
        }
        #end-screen h2 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        #word-review {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 15px;
            margin: 1.5rem 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #final-word-reveal { font-size: 2rem; color: #48bb78; display: block; margin: 0.5rem 0; }
        .end-button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .pronounce-final-btn {
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 10px;
        }

    </style>
</head>
<body>

    <div class="container" id="main-container">
        <header>
            <h1 id="game-title">WordWise Hangman</h1>
        </header>

        <div id="start-screen" class="screen active start-screen">
            <h2>พร้อมฝึกศัพท์ไหม?</h2>
            <p style="color: #a0aec0;">เลือกหมวดหมู่ด้านล่างเพื่อเริ่มเกม</p>
            <div class="btn-group" id="category-selection">
                </div>
        </div>

        <div id="game-screen" class="screen">
            <div id="status-bar">
                <span id="category-title">หมวดหมู่: ...</span>
                <span id="lives-left" style="color: #fc8181;">โอกาส: 8</span>
                <span id="score" style="color: #68d391;">คะแนน: 0/0</span> 
            </div>

            <div id="hangman-word-area">
                <svg id="hangman-svg" viewBox="0 0 200 200">
                    <line x1="20" y1="190" x2="180" y2="190" /> 
                    <line x1="50" y1="190" x2="50" y2="20" /> 
                    <line x1="50" y1="20" x2="140" y2="20" /> 
                    <line x1="140" y1="20" x2="140" y2="40" stroke="#f6e05e" /> 

                    <g id="hangman-figure">
                        <circle id="head" cx="140" cy="60" r="20" class="hangman-part head" style="display:none;" />
                        <line id="body" x1="140" y1="80" x2="140" y2="130" class="hangman-part" style="display:none;" />
                        <line id="left-arm" x1="140" y1="90" x2="110" y2="110" class="hangman-part" style="display:none;" />
                        <line id="right-arm" x1="140" y1="90" x2="170" y2="110" class="hangman-part" style="display:none;" />
                        <line id="left-leg" x1="140" y1="130" x2="120" y2="160" class="hangman-part" style="display:none;" />
                        <line id="right-leg" x1="140" y1="130" x2="160" y2="160" class="hangman-part" style="display:none;" />
                        
                        <g id="left-eye" class="hangman-part" style="display:none;">
                            <line x1="128" y1="52" x2="136" y2="58" stroke="#e74c3c" stroke-width="2"/>
                            <line x1="128" y1="58" x2="136" y2="52" stroke="#e74c3c" stroke-width="2"/>
                        </g>
                        <g id="right-eye" class="hangman-part" style="display:none;">
                            <line x1="144" y1="52" x2="152" y2="58" stroke="#e74c3c" stroke-width="2"/>
                            <line x1="144" y1="58" x2="152" y2="52" stroke="#e74c3c" stroke-width="2"/>
                        </g>
                    </g>
                </svg>
                <div id="word-display"></div>
            </div>

            <div id="hint-box">
                <div class="hint-item">
                    <span class="hint-label">คำใบ้:</span> 
                    <span id="hint-meaning-container" style="display: block; margin-top: 5px;">
                         <button id="show-hint-btn">กดเพื่อดูคำใบ้</button>
                        <span id="hint-meaning-display" style="font-style: italic; color: #a0aec0; display:none;"></span>
                    </span>
                </div>
                <div class="hint-item" style="margin-top: 10px; font-size: 0.85rem; color: #718096;">
                    <span class="hint-label">ตัวอย่าง:</span> 
                    <span id="hint-example"></span>
                </div>
            </div>

            <div id="keyboard">
                </div>
            
            <button id="give-up-btn" class="main-btn">
                ยอมแพ้ / กลับหน้าหลัก
            </button>
        </div>
        
        <div id="end-screen" class="screen">
            <div class="end-content">
                <h2 id="end-message"></h2>
                <p id="end-details" style="color: #a0aec0;"></p>
                
                <div id="word-review">
                    <div style="color: #a0aec0; font-size: 0.9rem;">คำศัพท์ที่ถูกต้อง</div>
                    <span id="final-word-reveal"></span>
                    <div id="final-meaning-reveal" style="color: #cbd5e0; margin-top: 5px;"></div>
                    <button id="final-pronounce-btn" class="pronounce-final-btn" title="ฟังเสียง">🔊</button>
                </div>
                
                <div class="end-button-group">
                    <button id="restart-btn" class="main-btn" style="flex: 1; background: var(--primary-grad);">ข้อต่อไป</button> 
                    <button id="back-home-btn" class="main-btn" style="flex: 1; background: #4a5568; box-shadow: none;">ออก</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const wordData = [
            { word: "FIG", category: "ผลไม้", descriptiveHint: "ผลไม้เล็กๆ เปลือกเขียว/ม่วง ข้างในมีเม็ดเล็กๆ", pos: "(N.)", example: "I had a dried fig for breakfast." },
            { word: "LIME", category: "ผลไม้", descriptiveHint: "ผลไม้รสเปรี้ยว เปลือกเขียว ใช้ทำเครื่องดื่ม", pos: "(N.)", example: "Squeeze lime into the water." },
            { word: "KIWI", category: "ผลไม้", descriptiveHint: "ผลไม้เล็กๆ มีขนปกคลุมข้างนอก เนื้อด้านในสีเขียวสดใส", pos: "(N.)", example: "Kiwi is great in fruit salad." },
            { word: "GRAPE", category: "ผลไม้", descriptiveHint: "ผลไม้ลูกเล็กๆ เป็นพวง ใช้ทำไวน์", pos: "(N.)", example: "A bunch of sweet green grapes." },
            { word: "MANGO", category: "ผลไม้", descriptiveHint: "ผลไม้เขตร้อน หวานฉ่ำ สีเหลือง", pos: "(N.)", example: "Ripe mango is very sweet." },
            { word: "APPLE", category: "ผลไม้", descriptiveHint: "ผลไม้กลม สีแดง/เขียว ยอดนิยม", pos: "(N.)", example: "An apple a day." },
            { word: "PEACH", category: "ผลไม้", descriptiveHint: "ผลไม้มีขนอ่อน สีชมพูอมส้ม", pos: "(N.)", example: "Sweet juicy peach." },
            { word: "ORANGE", category: "ผลไม้", descriptiveHint: "ผลไม้รสเปรี้ยวอมหวาน วิตามินซีสูง", pos: "(N.)", example: "Fresh orange juice." },
            { word: "BANANA", category: "ผลไม้", descriptiveHint: "ผลไม้ยาว สีเหลือง ลิงชอบกิน", pos: "(N.)", example: "Monkeys love bananas." },
            { word: "CHERRY", category: "ผลไม้", descriptiveHint: "ผลไม้ลูกเล็กสีแดง บนเค้ก", pos: "(N.)", example: "Cherry on top." },
            
            { word: "BUS", category: "การเดินทาง", descriptiveHint: "รถโดยสารขนาดใหญ่", pos: "(N.)", example: "Take the bus to work." },
            { word: "MAP", category: "การเดินทาง", descriptiveHint: "แผนที่บอกทาง", pos: "(N.)", example: "Look at the map." },
            { word: "TRIP", category: "การเดินทาง", descriptiveHint: "การเดินทางท่องเที่ยวสั้นๆ", pos: "(N.)", example: "A weekend trip." },
            { word: "BOAT", category: "การเดินทาง", descriptiveHint: "ยานพาหนะทางน้ำ", pos: "(N.)", example: "Fishing on a boat." },
            { word: "HOTEL", category: "การเดินทาง", descriptiveHint: "ที่พักค้างคืนสำหรับนักเดินทาง", pos: "(N.)", example: "Stay in a 5-star hotel." },
            
            { word: "IDEA", category: "นามธรรม", descriptiveHint: "ความคิดหรือแผนการ", pos: "(N.)", example: "A brilliant idea." },
            { word: "HOPE", category: "นามธรรม", descriptiveHint: "ความหวัง", pos: "(N.)", example: "Never lose hope." },
            { word: "LOGIC", category: "นามธรรม", descriptiveHint: "ตรรกะ เหตุผล", pos: "(N.)", example: "Use logic to solve it." },
            
            { word: "CAT", category: "สัตว์", descriptiveHint: "สัตว์เลี้ยง ร้องเหมียว", pos: "(N.)", example: "The cat is sleeping." },
            { word: "DOG", category: "สัตว์", descriptiveHint: "เพื่อนที่ดีที่สุดของมนุษย์", pos: "(N.)", example: "My dog barks loudly." },
            { word: "TIGER", category: "สัตว์", descriptiveHint: "แมวใหญ่ ลายพาดกลอน", pos: "(N.)", example: "Bengal tiger." },
            
            { word: "RICE", category: "อาหาร", descriptiveHint: "อาหารหลักคนเอเชีย", pos: "(N.)", example: "Fried rice." },
            { word: "PIZZA", category: "อาหาร", descriptiveHint: "แป้งแผ่นกลม หน้าชีสและซอส", pos: "(N.)", example: "Pepperoni pizza." },
            
            { word: "RAIN", category: "ธรรมชาติ", descriptiveHint: "น้ำที่ตกลงมาจากฟ้า", pos: "(N.)", example: "Singing in the rain." },
            { word: "SUN", category: "ธรรมชาติ", descriptiveHint: "ดาวฤกษ์ที่ให้แสงสว่าง", pos: "(N.)", example: "The sun rises." },
            
            { word: "BOOK", category: "สุ่ม 20 คำ (Random Mix)", descriptiveHint: "สิ่งที่มีหน้ากระดาษให้อ่าน", pos: "(N.)", example: "Read a book." },
            { word: "MUSIC", category: "สุ่ม 20 คำ (Random Mix)", descriptiveHint: "เสียงดนตรี ไพเราะ", pos: "(N.)", example: "Listen to music." },
            { word: "HAPPY", category: "สุ่ม 20 คำ (Random Mix)", descriptiveHint: "มีความสุข (Adjective)", pos: "(Adj.)", example: "I am happy." },
            { word: "WATER", category: "สุ่ม 20 คำ (Random Mix)", descriptiveHint: "ของเหลวใส จำเป็นต่อชีวิต", pos: "(N.)", example: "Drink water." }
        ];

        // --- VARS ---
        const hangmanSvgParts = ["head", "body", "left-arm", "right-arm", "left-leg", "right-leg", "left-eye", "right-eye"];
        const MAX_LIVES = hangmanSvgParts.length;
        
        let lives = MAX_LIVES;
        let currentWord = '';
        let currentWordDetails = null;
        let guessedLetters = new Set();
        let currentCategory = '';
        let totalScore = 0;
        let wordQueue = [];
        let currentWordIndex = 0;
        let hintUsed = false;
        
        let autoAdvanceTimeout;
        
        // Auto-Solve State
        let isAutoModeActive = false;
        let isAutoSolving = false;
        let autoSolveTimeoutId = null;
        let lettersToRevealQueue = [];

        // --- AUDIO ---
        let audioContext;
        
        function initAudioContext() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        function speakText(text, lang) {
            if (!('speechSynthesis' in window)) return null;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
            return utterance;
        }

        function playSound(type) {
            initAudioContext();
            if (!audioContext || audioContext.state === 'suspended') return;
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);

            if (type === 'correct') {
                osc.frequency.setValueAtTime(600, audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                osc.start();
                osc.stop(audioContext.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioContext.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioContext.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioContext.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                osc.start();
                osc.stop(audioContext.currentTime + 0.3);
            }
        }

        // --- CORE LOGIC ---
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function drawHangman(livesLeft) {
            const partsLost = MAX_LIVES - livesLeft;
            hangmanSvgParts.forEach((partId, index) => {
                const part = document.getElementById(partId);
                part.style.display = index < partsLost ? 'block' : 'none';
            });
        }

        function updateWordDisplay() {
            const container = document.getElementById('word-display');
            container.innerHTML = '';
            let solved = true;
            
            for (const char of currentWord) {
                const span = document.createElement('span');
                span.className = 'letter-slot';
                
                if (guessedLetters.has(char)) {
                    span.textContent = char;
                } else {
                    span.textContent = '';
                    span.classList.add('placeholder');
                    solved = false;
                }
                container.appendChild(span);
            }
            return solved;
        }

        function generateKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';
            // REMOVED: Keyboard hiding logic to show keys in auto mode

            for (let i = 65; i <= 90; i++) {
                const char = String.fromCharCode(i);
                const btn = document.createElement('button');
                btn.textContent = char;
                btn.className = 'key-btn';
                btn.setAttribute('data-char', char); // Helper for finding button
                btn.onclick = () => handleManualGuess(char, btn);
                
                // Restore state if revisiting word
                if (guessedLetters.has(char)) {
                    btn.disabled = true;
                    btn.classList.add(currentWord.includes(char) ? 'correct' : 'wrong');
                }
                keyboard.appendChild(btn);
            }
        }

        // --- MANUAL PLAY ---
        function handleManualGuess(char, btn) {
            if (isAutoSolving || isAutoModeActive) return;
            
            btn.disabled = true;
            guessedLetters.add(char);
            
            if (currentWord.includes(char)) {
                btn.classList.add('correct');
                playSound('correct');
                const solved = updateWordDisplay();
                if (solved) {
                    document.getElementById('score').innerText = `คะแนน: ${++totalScore}/${wordQueue.length}`;
                    disableControls();
                    // DELAY 0.5s BEFORE END SCREEN
                    setTimeout(() => endGame(true), 500);
                }
            } else {
                btn.classList.add('wrong');
                lives--;
                playSound('wrong');
                drawHangman(lives);
                document.getElementById('lives-left').innerText = `โอกาส: ${lives}`;
                
                // Shake Effect
                const container = document.querySelector('.container');
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 500);

                if (lives <= 0) {
                    disableControls();
                    setTimeout(() => endGame(false), 500);
                }
            }
        }

        function disableControls() {
            document.querySelectorAll('.key-btn').forEach(b => b.disabled = true);
            // In manual mode we disable hint/giveup on end
            if(!isAutoModeActive) {
                document.getElementById('show-hint-btn').disabled = true;
                document.getElementById('give-up-btn').disabled = true;
            }
        }

        // --- AUTO SOLVE LOGIC ---
        function startAutoSolve() {
            if (!isAutoModeActive) return;
            
            // Generate queue of unique correct letters
            const letters = [...new Set(currentWord.split(''))].filter(c => c >= 'A' && c <= 'Z');
            lettersToRevealQueue = letters;
            shuffle(lettersToRevealQueue);
            
            // Auto Trigger Hint
            setTimeout(() => {
                document.getElementById('show-hint-btn').click();
            }, 300);

            isAutoSolving = true;
            autoSolveLoop();
        }

        function autoSolveLoop() {
            if (!isAutoSolving || lettersToRevealQueue.length === 0) return;

            const char = lettersToRevealQueue.shift();
            // Random delay 0.8 - 1.0s
            const delay = Math.random() * 200 + 800;

            autoSolveTimeoutId = setTimeout(() => {
                guessedLetters.add(char);
                playSound('correct');
                
                // Visual Button Press Effect
                const btn = document.querySelector(`.key-btn[data-char="${char}"]`);
                if(btn) {
                    btn.classList.add('simulated-press'); // Add press effect
                    setTimeout(() => {
                        btn.classList.remove('simulated-press');
                        btn.classList.add('correct'); // Then turn green
                        btn.disabled = true;
                    }, 150);
                }

                const solved = updateWordDisplay();
                
                if (solved) {
                    isAutoSolving = false;
                    document.getElementById('score').innerText = `คะแนน: ${++totalScore}/${wordQueue.length}`;
                    // DELAY 0.5s BEFORE END SCREEN
                    setTimeout(() => endGame(true), 500);
                } else {
                    autoSolveLoop();
                }
            }, delay);
        }

        function stopAutoSolve() {
            clearTimeout(autoSolveTimeoutId);
            isAutoSolving = false;
        }

        // --- GAME FLOW ---
        function startSession(category) {
            currentCategory = category;
            // Filter logic
            let words = (category === "สุ่มรวมทุกหมวด") ? wordData : wordData.filter(w => w.category === category);
            
            // Remove duplicates
            const seen = new Set();
            wordQueue = words.filter(w => {
                const duplicate = seen.has(w.word);
                seen.add(w.word);
                return !duplicate;
            });
            
            shuffle(wordQueue);
            
            if (wordQueue.length === 0) return alert("ไม่มีคำศัพท์ในหมวดนี้");
            
            currentWordIndex = 0;
            totalScore = 0;
            switchScreen('game-screen');
            loadWord();
        }

        function loadWord() {
            if (currentWordIndex >= wordQueue.length) return finishSession();

            currentWordDetails = wordQueue[currentWordIndex];
            currentWord = currentWordDetails.word.toUpperCase();
            
            // Reset State
            lives = MAX_LIVES;
            guessedLetters.clear();
            hintUsed = false;
            stopAutoSolve();
            
            // UI Reset
            drawHangman(lives);
            updateWordDisplay();
            generateKeyboard();
            
            document.getElementById('category-title').innerText = `หมวดหมู่: ${currentCategory}`;
            document.getElementById('lives-left').innerText = `โอกาส: ${lives}`;
            document.getElementById('score').innerText = `คะแนน: ${totalScore}/${wordQueue.length}`;
            
            // Hint Reset
            const hintDisplay = document.getElementById('hint-meaning-display');
            const hintBtn = document.getElementById('show-hint-btn');
            hintDisplay.style.display = 'none';
            hintDisplay.innerText = `[${currentWordDetails.pos}] ${currentWordDetails.descriptiveHint}`;
            hintBtn.style.display = 'inline-block';
            hintBtn.disabled = false;
            
            document.getElementById('hint-example').innerText = currentWordDetails.example.replace(new RegExp(currentWordDetails.word, 'gi'), '___');
            
            // Buttons
            document.getElementById('give-up-btn').style.display = 'block';
            document.getElementById('give-up-btn').disabled = false;

            if (isAutoModeActive) startAutoSolve();
        }

        function endGame(isWin) {
            stopAutoSolve();
            const hasNext = currentWordIndex + 1 < wordQueue.length;
            
            // Populate End Screen
            document.getElementById('end-message').innerText = isWin ? "ยอดเยี่ยม! ถูกต้อง" : "เสียใจด้วย! คำตอบคือ";
            document.getElementById('end-message').style.color = isWin ? 'var(--color-correct)' : 'var(--color-wrong)';
            document.getElementById('end-details').innerText = `คำที่ ${currentWordIndex + 1}/${wordQueue.length}`;
            document.getElementById('final-word-reveal').innerText = currentWord;
            document.getElementById('final-meaning-reveal').innerText = `${currentWordDetails.descriptiveHint} ${currentWordDetails.example}`;
            
            // Buttons logic
            const restartBtn = document.getElementById('restart-btn');
            restartBtn.innerText = hasNext ? "ข้อต่อไป" : "จบเกม";
            restartBtn.onclick = hasNext ? nextWord : finishSession;
            document.getElementById('back-home-btn').onclick = finishSession;
            
            // BUG FIX: Ensure buttons are enabled on last word in auto mode
            if (isAutoModeActive && !hasNext) {
                restartBtn.disabled = false;
                document.getElementById('back-home-btn').disabled = false;
            }
            
            switchScreen('end-screen');

            // **LOGIC: Read Word & Auto Advance**
            // 1. Read immediately on entering screen (Manual & Auto)
            setTimeout(() => {
                speakText(currentWord, 'en-US');
            }, 50);

            // 2. If Auto Mode AND Not Last Word, wait 4.5s then next
            if (isAutoModeActive && hasNext && isWin) {
                // Disable buttons during auto-wait
                restartBtn.disabled = true;
                document.getElementById('back-home-btn').disabled = true;
                
                autoAdvanceTimeout = setTimeout(() => {
                    nextWord();
                }, 4500); // 4.5 seconds fixed delay
            }
        }

        function nextWord() {
            clearTimeout(autoAdvanceTimeout);
            currentWordIndex++;
            switchScreen('game-screen');
            loadWord();
        }

        function finishSession() {
            clearTimeout(autoAdvanceTimeout);
            stopAutoSolve();
            switchScreen('start-screen');
            isAutoModeActive = false; // Reset secret mode on exit
            document.getElementById('game-title').classList.remove('robot-active');
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // --- INIT & EVENTS ---
        function setupCategories() {
            const cats = [...new Set(wordData.map(d => d.category))].filter(c => c !== "สุ่ม 20 คำ (Random Mix)");
            const container = document.getElementById('category-selection');
            container.innerHTML = '';
            
            cats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'main-btn';
                btn.innerText = cat;
                btn.onclick = () => startSession(cat);
                container.appendChild(btn);
            });
            
            const randomBtn = document.createElement('button');
            randomBtn.className = 'main-btn btn-random';
            randomBtn.innerText = "สุ่มรวมทุกหมวด";
            randomBtn.onclick = () => startSession("สุ่มรวมทุกหมวด");
            container.appendChild(randomBtn);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupCategories();
            
            // Audio Context Resume
            document.addEventListener('click', () => {
                initAudioContext();
                if (audioContext && audioContext.state === 'suspended') audioContext.resume();
            }, { once: true });

            // Secret Mode Toggle
            document.getElementById('game-title').ondblclick = (e) => {
                e.preventDefault();
                isAutoModeActive = !isAutoModeActive;
                const title = document.getElementById('game-title');
                
                if (isAutoModeActive) {
                    title.classList.add('robot-active');
                    alert("🤖 Auto-Solve Mode Activated!");
                    if (document.getElementById('game-screen').classList.contains('active')) loadWord();
                } else {
                    title.classList.remove('robot-active');
                    alert("👤 Manual Mode");
                    stopAutoSolve();
                    if (document.getElementById('game-screen').classList.contains('active')) loadWord(); // Reload to reset UI
                }
            };

            // Hint Button
            document.getElementById('show-hint-btn').onclick = function() {
                this.style.display = 'none';
                document.getElementById('hint-meaning-display').style.display = 'inline';
            };

            // Pronounce Button (End Screen)
            document.getElementById('final-pronounce-btn').onclick = () => speakText(currentWord, 'en-US');
            
            // Give Up
            document.getElementById('give-up-btn').onclick = () => {
                if(confirm("ยอมแพ้?")) finishSession();
            };
        });
    </script>
</body>
</html>
