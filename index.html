<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordWise Hangman - เกมฝึกศัพท์</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #38C172; /* เขียว */
            --color-secondary: #42A5F5; /* ฟ้า */
            --color-correct: #38C172;
            --color-wrong: #EF5350;
            --color-bg: #2C3E50; /* น้ำเงินเข้ม */
            --color-card: #34495E; /* น้ำเงินกลาง */
            --color-text-dark: #ECF0F1; /* ขาวเทาอ่อน */
            --color-text-light: #FFFFFF;
            --color-hint-bg: #223040;
            --color-hint-border: #F1C40F;
        }
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--color-card);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header { 
            background: var(--color-hint-bg); 
            color: var(--color-primary); 
            padding: 1.5rem; 
        }
        
        /* Screen Management */
        .screen { 
            display: none; 
            padding: 1rem; 
            flex-grow: 1; /* ให้แต่ละ screen ยืดพื้นที่แนวตั้งเต็มที่ */
        }
        .screen.active { 
            display: flex; 
            flex-direction: column; /* FIX 1: แก้ปัญหาหน้าจอแบ่ง 2 จอ บังคับให้เป็นคอลัมน์เสมอ */
            justify-content: space-between; /* จัดเนื้อหาหลักให้มีระยะห่าง */
        }
        
        /* Start/End Screen Styles */
        .start-screen h2 { color: var(--color-primary); }
        .btn-group { display: flex; flex-direction: column; gap: 12px; width: 90%; max-width: 400px; margin: 1.5rem auto; }
        .main-btn {
            background-color: var(--color-secondary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #3188d6;
            transition: all 0.1s;
        }
        .main-btn.btn-random { background-color: var(--color-primary); box-shadow: 0 4px 0 #32A860; }
        .main-btn:active { transform: translateY(4px); box-shadow: 0 0 0; }
        
        /* --- Game Screen Components --- */
        #status-bar {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            margin-bottom: 1.5rem;
            color: var(--color-text-light);
            font-size: 0.9rem;
        }
        #word-display {
            display: flex;
            justify-content: center;
            gap: 5px;
            font-size: 2.8rem; /* ขนาดฟอนต์ใหญ่ */
            font-weight: 900;
            margin-bottom: 2rem;
            color: var(--color-primary);
            line-height: 1.2;
            flex-wrap: wrap; /* ให้คำที่ยาวขึ้นบรรทัดใหม่ได้ */
        }
        .letter-slot {
            display: flex;
            justify-content: center;
            /* FIX 2: ปรับ align-items และ padding เพื่อให้ตัวอักษรอยู่สมดุลกลางช่อง */
            align-items: center; 
            width: 1.2ch; 
            text-align: center;
            box-sizing: border-box;
            border-bottom: 4px solid var(--color-text-dark); /* เส้นขีดล่าง */
            
            padding-top: 20px; /* เพิ่มสเปซด้านบนตัวอักษร */
            padding-bottom: 8px; /* เพิ่มสเปซด้านล่างตัวอักษร */
        }
        #keyboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }
        #keyboard .main-btn {
            width: 38px;
            height: 38px;
            font-size: 1rem;
            padding: 0;
        }
        .correct { background-color: var(--color-correct); box-shadow: 0 4px 0 #32A860; }
        .wrong { background-color: var(--color-wrong); box-shadow: 0 4px 0 #C43835; opacity: 0.6; }
    </style>
</head>
<body>
<div class="container">
<header><h1>WordWise Hangman</h1></header>

<div id="start-screen" class="screen active start-screen">
    <h2>ยินดีต้อนรับสู่ Hangman ฝึกศัพท์!</h2>
    <p>มีทั้งหมด 11 หมวดหมู่ให้เลือก:</p>
    <div class="btn-group" id="category-selection"></div>
</div>

<div id="game-screen" class="screen">
    <div id="status-bar">
        <span id="category-title">หมวดหมู่:</span>
        <span id="lives-left">โอกาส: 8</span>
        <span id="score">คะแนน: 0/0</span>
    </div>
    <div id="word-display"></div>
    <div id="keyboard"></div>
    <button id="give-up-btn" class="main-btn" style="background-color:#7F8C8D;">ยอมแพ้ / กลับหน้าหลัก</button>
</div>

<div id="end-screen" class="screen start-screen">
    <h2 id="end-message"></h2>
    <p id="end-details"></p>
    <button id="restart-btn" class="main-btn btn-random">เล่นต่อ</button>
</div>
</div>

<script>
// ----------- DATA (ย่อไว้ ตัวจริงใช้ชุดเต็มของคุณได้เลย) ------------
const wordData = [
  { word: "APPLE", category: "ผลไม้", descriptiveHint: "ผลไม้สีแดงหรือเขียว", pos: "(N.)", example: "An apple a day keeps the doctor away." },
  { word: "DOG", category: "สัตว์", descriptiveHint: "เพื่อนที่ซื่อสัตย์ของมนุษย์", pos: "(N.)", example: "My dog barks loudly." },
  { word: "TEACHER", category: "อาชีพ", descriptiveHint: "ผู้สอนนักเรียนในโรงเรียน", pos: "(N.)", example: "My teacher is kind." },
  { word: "SUN", category: "ธรรมชาติและภูมิศาสตร์", descriptiveHint: "ดาวฤกษ์ที่ให้แสงและความร้อนแก่โลก", pos: "(N.)", example: "The sun rises in the east." },
  { word: "CHAIR", category: "บ้านและเฟอร์นิเจอร์", descriptiveHint: "สิ่งที่ใช้นั่ง", pos: "(N.)", example: "This chair is comfortable." },
  { word: "LIME", category: "ผลไม้", descriptiveHint: "ผลไม้รสเปรี้ยวสีเขียว", pos: "(N.)", example: "I put lime in the water." },
];

// ----------- GAME CORE -----------
const startScreen = document.getElementById('start-screen');
const gameScreen = document.getElementById('game-screen');
const endScreen = document.getElementById('end-screen');
const categorySelection = document.getElementById('category-selection');
const categoryTitleEl = document.getElementById('category-title');
const livesLeftEl = document.getElementById('lives-left');
const scoreEl = document.getElementById('score');
const wordDisplay = document.getElementById('word-display');
const keyboardEl = document.getElementById('keyboard');
const giveUpBtn = document.getElementById('give-up-btn');
const restartBtn = document.getElementById('restart-btn');
const endMessageEl = document.getElementById('end-message');
const endDetailsEl = document.getElementById('end-details');

let lives = 8;
let currentWord = '';
let guessedLetters = new Set();
let currentCategory = '';
let totalScore = 0;
let wordQueue = [];
let currentWordIndex = 0;

function shuffle(array){ for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];} }

function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* *** แก้ไข: ใช้ innerHTML เพื่อสร้างแท็ก <span class="letter-slot"> และใส่ตัวอักษร *** */
function updateWordDisplay(){
    let displayHtml = '';
    let solved = true;
    for(const ch of currentWord){
        const letter = guessedLetters.has(ch) ? ch : '';
        displayHtml += `<span class="letter-slot">${letter}</span>`;
        if (letter === '') solved = false;
    }
    wordDisplay.innerHTML = displayHtml;
    return solved;
}
/* *********************************************************************************** */

/* *** แก้ไข: ใส่ data-letter attribute และจัดการ class/disable ของปุ่ม *** */
function generateKeyboard(){
    keyboardEl.innerHTML='';
    for(let i=65;i<=90;i++){
        const c=String.fromCharCode(i);
        const btn=document.createElement('button');
        btn.textContent=c; 
        btn.className='main-btn'; 
        btn.setAttribute('data-letter', c); /* เพิ่ม data-letter สำหรับอ้างอิง */

        /* กำหนดสถานะของปุ่มหากเคยถูกกดในเซสชันก่อนหน้า */
        if (guessedLetters.has(c)) {
            btn.disabled = true;
            if (currentWord.includes(c)) btn.classList.add('correct');
            else btn.classList.add('wrong');
        } else {
            btn.addEventListener('click',()=>handleGuess(c));
        }
        keyboardEl.appendChild(btn);
    }
}
/* *********************************************************************** */

/* *** แก้ไข: จัดการ class/disable ของปุ่มที่ถูกกด *** */
function handleGuess(c){
    if(guessedLetters.has(c)) return;
    guessedLetters.add(c);
    
    // หาปุ่มที่ถูกกดเพื่อปรับสไตล์
    const btn = document.querySelector(`#keyboard button[data-letter="${c}"]`);
    if(btn) btn.disabled = true;
    
    if(currentWord.includes(c)){
        if(btn) btn.classList.add('correct'); // ถูก
        if(updateWordDisplay()) endGame(true);
    }else{
        if(btn) btn.classList.add('wrong'); // ผิด
        lives--; livesLeftEl.textContent=`โอกาส: ${lives}`;
        if(lives<=0) endGame(false);
    }
}
/* *************************************************** */

function startSession(category){
    currentCategory=category;
    let availableWords;
    const randomCategoryName="สุ่มรวมทุกหมวด";
    if(category===randomCategoryName) availableWords=[...wordData];
    else availableWords=wordData.filter(d=>d.category===category);
    shuffle(availableWords);
    wordQueue=[...availableWords];
    currentWordIndex=0;
    totalScore=0;
    showScreen('game-screen');
    loadNextWord();
}

function loadNextWord(){
    if(currentWordIndex>=wordQueue.length){ endSession(); return; }
    const w=wordQueue[currentWordIndex];
    currentWord=w.word.toUpperCase();
    guessedLetters.clear(); lives=8;
    categoryTitleEl.textContent=`หมวดหมู่: ${currentCategory}`;
    livesLeftEl.textContent=`โอกาส: ${lives}`;
    scoreEl.textContent=`คะแนน: ${totalScore}/${wordQueue.length}`;
    updateWordDisplay(); generateKeyboard();
}

function endGame(isWin){
    if(isWin){ totalScore++; endMessageEl.textContent="🎉 คุณชนะ!"; }
    else endMessageEl.textContent="😭 คุณแพ้!";
    endDetailsEl.textContent=`คะแนน: ${totalScore}/${wordQueue.length}`;
    showScreen('end-screen');
}

function endSession(){ showScreen('start-screen'); }

function setupCategoryButtons(){
    const allCategories=[...new Set(wordData.map(d=>d.category))];
    categorySelection.innerHTML='';
    allCategories.forEach(cat=>{
        const count=wordData.filter(d=>d.category===cat).length;
        const btn=document.createElement('button');
        btn.className='main-btn';
        btn.textContent=`${cat} (${count} คำ)`;
        btn.addEventListener('click',()=>startSession(cat));
        categorySelection.appendChild(btn);
    });
    const randomCategoryName="สุ่มรวมทุกหมวด";
    const randomBtn=document.createElement('button');
    randomBtn.className='main-btn btn-random';
    randomBtn.textContent=`${randomCategoryName} (All Words Mix: ${wordData.length} คำ)`;
    randomBtn.addEventListener('click',()=>startSession(randomCategoryName));
    categorySelection.appendChild(randomBtn);
}

giveUpBtn.addEventListener('click',()=>endSession());
restartBtn.addEventListener('click',()=>{
    currentWordIndex++;
    if(currentWordIndex<wordQueue.length){ showScreen('game-screen'); loadNextWord(); }
    else endSession();
});

// ✅ เรียกหลังประกาศทุกอย่างแล้ว
setupCategoryButtons();
updateWordDisplay();
</script>
</body>
</html>
