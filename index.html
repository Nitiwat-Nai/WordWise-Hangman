<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordWise Hangman - เกมฝึกศัพท์</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* --- THEME & GLOBAL STYLES (Dark/Green Theme) --- */
        :root {
            --color-primary: #38C172; /* Bright Green - For emphasis, score, correct */
            --color-secondary: #42A5F5; /* Blue - For keyboard keys */
            --color-correct: #38C172; 
            --color-wrong: #EF5350; /* Red */
            --color-bg: #2C3E50; /* Dark Blue Gray */
            --color-card: #34495E; /* Slightly Lighter Dark Gray */
            --color-text-dark: #ECF0F1; /* Light Text */
            --color-text-light: #FFFFFF;
            --color-hint-bg: #223040; /* Very Dark Blue for Hint Box */
            --color-hint-border: #F1C40F; /* Gold accent for hint border */
            --color-hangman-wood: #7F8C8D; /* Light Gray/Silver for gallows */
            --color-hangman-rope: #BDC3C7; /* Lighter Gray */
            --color-hangman-body: #F1C40F; /* Gold/Yellow body */
        }

        /* Responsive Container */
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            background-color: var(--color-card);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            min-height: 100vh;
            
            /* *** FIX 1: บังคับให้เป็น Column เสมอ *** */
            display: flex;
            flex-direction: column; 
            
            justify-content: flex-start;
            padding: 0;
        }

        /* Header (ปรับลด Padding) */
        header {
            background-color: var(--color-hint-bg); 
            color: var(--color-primary);
            padding: 1rem 1rem; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            margin-bottom: 0.5rem; 
        }
        header h1 {
            font-size: 1.8rem;
            margin: 0;
        }

        /* Screen Management (ปรับลด Padding) */
        .screen {
            padding: 0.5rem 1rem; 
            display: none; 
            flex-grow: 1;
        }
        .screen.active {
            display: flex;
            /* *** FIX 1: บังคับให้เป็น Column เสมอ *** */
            flex-direction: column; 
            
            justify-content: space-between;
        }
        
        /* --- Start/End Screen --- */
        .start-screen h2 {
            font-size: 2rem;
            color: var(--color-primary);
            margin-bottom: 0.5rem; 
        }
        .start-screen .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 90%;
            max-width: 400px;
            margin: 0 auto 0.5rem; 
            overflow-y: auto; 
            max-height: 60vh;
            padding: 0 5px;
        }
        .main-btn {
            background-color: var(--color-secondary);
            color: var(--color-text-light);
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #3188d6;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .main-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3188d6;
        }
        .main-btn.btn-random {
            background-color: var(--color-primary);
            box-shadow: 0 4px 0 #32A860;
        }
        .main-btn.btn-random:active {
            box-shadow: 0 2px 0 #32A860;
        }


        /* --- Game Screen Components --- */
        #status-bar {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 1rem; 
            padding: 0 0.5rem;
            color: var(--color-text-dark);
        }

        /* Hangman and Word Area */
        #hangman-word-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 0.5rem; 
            padding: 0.5rem; 
        }
        
        #hangman-svg {
            width: 180px; 
            height: 180px; 
            margin-bottom: 0.5rem; 
            overflow: visible; 
            background-color: #223040; 
            border-radius: 10px;
            padding: 10px;
        }
        .hangman-part {
            stroke: var(--color-hangman-body);
            stroke-width: 3;
            fill: none;
        }
        .hangman-part.head {
            fill: var(--color-hangman-body);
            stroke: none;
        }

        /* *** FIX 2: ปรับปรุงส่วนแสดงคำศัพท์/สเปซด้านบน *** */
        #word-display {
            display: flex; 
            justify-content: center;
            gap: 10px; 
            font-size: 2.8rem; 
            font-weight: 900;
            margin-bottom: 0.5rem; 
            color: var(--color-primary); 
            line-height: 1.2; 
        }
        .letter-slot {
            display: flex; 
            justify-content: center;
            
            /* FIX: จัดตัวอักษรให้อยู่ตรงกลางของช่อง */
            align-items: center; 
            
            width: 1.2ch; 
            text-align: center;
            box-sizing: border-box;
            
            /* FIX: เพิ่ม padding-top เพื่อให้มีสเปซด้านบนตัวอักษรมากขึ้น */
            padding-top: 20px; 
            
            /* FIX: ปรับ padding-bottom ให้เหมาะสมกับเส้นขีดล่าง */
            padding-bottom: 8px; 
        }
        .letter-slot.placeholder {
            /* สำหรับช่องที่ยังไม่ได้ตอบ (แสดงขีดล่าง) */
            border-bottom: 5px solid var(--color-primary); 
            color: transparent; 
            font-weight: 900;
        }
        .letter-slot:not(.placeholder) {
             /* สำหรับช่องที่ตอบแล้ว (แสดงตัวอักษร) */
             border-bottom: 5px solid transparent; 
        }
        
        /* Hint Box */
        #hint-box {
            background-color: var(--color-hint-bg);
            border: 2px solid var(--color-hint-border);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem; 
            text-align: left;
            font-size: 0.95rem;
            color: var(--color-text-dark);
            min-height: 50px; 
        }
        .hint-item {
            margin-bottom: 0.5rem;
        }
        .hint-label {
            font-weight: bold;
            color: var(--color-primary);
            margin-right: 5px;
        }

        #show-hint-btn {
            background-color: #FFB74D; 
            color: var(--color-text-dark);
            border: none;
            padding: 0.5rem 1rem; 
            border-radius: 8px;
            font-size: 1rem; 
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #FF9800;
            display: inline-block;
        }
        #show-hint-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #FF9800;
        }
        #show-hint-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        #hint-meaning-display {
            font-style: italic;
            color: #BDC3C7; 
            min-height: 20px; 
            display: none; 
        }
        
        /* Keyboard */
        #keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            padding: 0 0.5rem 0.5rem; 
        }

        .key-btn {
            background-color: var(--color-secondary);
            color: var(--color-text-light);
            border: none;
            padding: 0.7rem 0.2rem;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #3188d6;
            transition: all 0.1s;
        }

        .key-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #3188d6;
        }

        .key-btn.correct {
            background-color: var(--color-correct);
            box-shadow: 0 3px 0 #32A860;
        }

        .key-btn.wrong {
            background-color: var(--color-wrong);
            box-shadow: 0 3px 0 #C62828;
        }

        .key-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        /* ปุ่มยอมแพ้ */
        #give-up-btn {
            margin-top: 0.5rem !important; 
        }

        /* --- End Game Screen --- */
        .end-button-group {
            display: flex;
            justify-content: space-between; 
            gap: 10px;
            width: 100%; 
            max-width: 450px; 
            margin: 2rem auto 0;
            padding: 0 1rem;
            box-sizing: border-box;
        }
        .btn-restart {
            background-color: var(--color-primary);
            box-shadow: 0 5px 0 #32A860;
            width: 50%;
            margin-top: 0 !important; 
        }
        .btn-back-home {
            background-color: #6A7A7B; 
            box-shadow: 0 5px 0 #576364; 
            width: 50%; 
            margin-top: 0 !important; 
        }

    </style>
</head>
<body>

    <div class="container" id="main-container">
        <header>
            <h1>WordWise Hangman</h1>
        </header>

        <div id="start-screen" class="screen active start-screen">
            <h2>ยินดีต้อนรับสู่ Hangman ฝึกศัพท์!</h2>
            <p>เลือกหมวดหมู่เพื่อเริ่มเล่น:</p>
            <div class="btn-group" id="category-selection">
                </div>
        </div>

        <div id="game-screen" class="screen">
            <div id="status-bar">
                <span id="category-title">หมวดหมู่:</span>
                <span id="lives-left">โอกาส: 8</span>
                <span id="score">คะแนน: 0/0</span> 
            </div>

            <div id="hangman-word-area">
                
                <svg id="hangman-svg" viewBox="0 0 200 200">
                    
                    <line x1="10" y1="190" x2="190" y2="190" stroke-width="6" stroke="var(--color-hangman-wood)" /> 
                    <line x1="50" y1="190" x2="50" y2="10" stroke-width="6" stroke="var(--color-hangman-wood)" /> 
                    <line x1="50" y1="10" x2="140" y2="10" stroke-width="6" stroke="var(--color-hangman-wood)" /> 
                    <line x1="140" y1="10" x2="140" y2="40" stroke-width="4" stroke="var(--color-hangman-rope)" /> 

                    <g id="hangman-figure">
                        <circle id="head" cx="140" cy="60" r="20" class="hangman-part" style="display:none;" />
                        <line id="body" x1="140" y1="80" x2="140" y2="130" class="hangman-part" style="display:none;" />
                        <line id="left-arm" x1="140" y1="90" x2="110" y2="110" class="hangman-part" style="display:none;" />
                        <line id="right-arm" x1="140" y1="90" x2="170" y2="110" class="hangman-part" style="display:none;" />
                        <line id="left-leg" x1="140" y1="130" x2="120" y2="160" class="hangman-part" style="display:none;" />
                        <line id="right-leg" x1="140" y1="130" x2="160" y2="160" class="hangman-part" style="display:none;" />
                        
                        <g id="left-eye" class="hangman-part" style="display:none;">
                            <line x1="128" y1="52" x2="136" y2="58" stroke="var(--color-wrong)" stroke-width="2"/>
                            <line x1="128" y1="58" x2="136" y2="52" stroke="var(--color-wrong)" stroke-width="2"/>
                        </g>
                        <g id="right-eye" class="hangman-part" style="display:none;">
                            <line x1="144" y1="52" x2="152" y2="58" stroke="var(--color-wrong)" stroke-width="2"/>
                            <line x1="144" y1="58" x2="152" y2="52" stroke="var(--color-wrong)" stroke-width="2"/>
                        </g>

                    </g>
                </svg>
                <div id="word-display"></div>
            </div>

            <div id="hint-box">
                <div class="hint-item" style="margin-bottom: 0.5rem;">
                    <span class="hint-label">คำใบ้:</span> 
                    <span id="hint-meaning-container" style="min-height: 20px; display: block;">
                        <button id="show-hint-btn" class="hint-inline-btn">แสดงคำใบ้ (1 ครั้ง)</button>
                        <span id="hint-meaning-display" style="font-style: italic; color: #BDC3C7; display:none;"></span>
                    </span>
                </div>
                <div class="hint-item" id="example-sentence-container" style="margin-bottom: 0;">
                    <span class="hint-label">ตัวอย่างประโยค:</span> 
                    <span id="hint-example"></span>
                </div>
            </div>

            <div id="keyboard">
                </div>
            
            <button id="give-up-btn" class="main-btn" style="background-color: #7F8C8D; box-shadow: 0 5px 0 #6A7A7B; width: 100%; margin-top: 0.5rem;">
                ยอมแพ้ / กลับหน้าหลัก
            </button>
        </div>
        
        <div id="end-screen" class="screen start-screen">
            <div class="end-content">
                <h2 id="end-message"></h2>
                <p id="end-details"></p>
                
                <div id="word-review">
                    <div class="word-result">
                        คำศัพท์ที่ถูกต้องคือ: 
                        <span id="final-word-reveal" class="meaning" style="font-size: 1.8rem; color: var(--color-primary);"></span>
                        <button id="final-pronounce-btn" title="กดเพื่อฟังการออกเสียง" class="pronounce-final-btn">🔊</button>
                    </div>
                    <div class="word-result" style="color: var(--color-text-dark); margin-left: 0.5rem;">
                        <span id="final-meaning-reveal" class="meaning" style="margin-left: 0;"></span>
                    </div>
                </div>
                
                <div class="end-button-group">
                    <button id="restart-btn" class="main-btn btn-restart">โหลด...</button> 
                    <button id="back-home-btn" class="main-btn btn-back-home">
                        กลับหน้าหลัก
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA (ย่อไว้) ---
        const wordData = [
            { word: "APPLE", category: "ผลไม้", descriptiveHint: "ผลไม้สีแดงหรือเขียว", pos: "(N.)", example: "An apple a day keeps the doctor away." },
            { word: "DOG", category: "สัตว์", descriptiveHint: "เพื่อนที่ซื่อสัตย์ของมนุษย์", pos: "(N.)", example: "My dog barks loudly." },
            { word: "TEACHER", category: "อาชีพ", descriptiveHint: "ผู้สอนนักเรียนในโรงเรียน", pos: "(N.)", example: "My teacher is kind." },
            { word: "SUN", category: "ธรรมชาติและภูมิศาสตร์", descriptiveHint: "ดาวฤกษ์ที่ให้แสงและความร้อนแก่โลก", pos: "(N.)", example: "The sun rises in the east." },
            { word: "CHAIR", category: "บ้านและเฟอร์นิเจอร์", descriptiveHint: "สิ่งที่ใช้นั่ง", pos: "(N.)", example: "This chair is comfortable." },
            { word: "LIME", category: "ผลไม้", descriptiveHint: "ผลไม้รสเปรี้ยวสีเขียว", pos: "(N.)", example: "I put lime in the water." },
            { word: "KIWI", category: "ผลไม้", descriptiveHint: "ผลไม้เล็กๆ มีขนปกคลุมข้างนอก เนื้อด้านในสีเขียวสดใส", pos: "(N.)", example: "A slice of kiwi is a great addition to the fruit salad." },
            { word: "MAP", category: "การเดินทาง", descriptiveHint: "แผ่นภาพแสดงพื้นที่และเส้นทางภูมิศาสตร์ ใช้หาทิศทาง", pos: "(N.)", example: "We used a paper map to navigate the city." },
            { word: "VOYAGE", category: "การเดินทาง", descriptiveHint: "การเดินทางไกลโดยเฉพาะทางทะเลหรือในอวกาศ", pos: "(N.)", example: "The ancient sailors began their long voyage across the sea." },
            { word: "IDEA", category: "แนวคิดนามธรรม", descriptiveHint: "ความคิดหรือแผนในใจ", pos: "(N.)", example: "That's a brilliant idea for the new project." },
            { word: "HONESTY", category: "แนวคิดนามธรรม", descriptiveHint: "คุณภาพของการพูดความจริงและการไม่หลอกลวง", pos: "(N.)", example: "Honesty is the best policy." },
            { word: "WOLF", category: "สัตว์", descriptiveHint: "สัตว์กินเนื้อที่อยู่ในตระกูลสุนัข มักล่าเหยื่อเป็นฝูง", pos: "(N.)", example: "A lone wolf howled at the full moon." },
            { word: "TIGER", category: "สัตว์", descriptiveHint: "สัตว์ตระกูลแมวที่มีขนาดใหญ่ที่สุด มีลายทางสีดำบนขนสีส้ม", pos: "(N.)", example: "The Bengal tiger is an endangered species." },
            { word: "EGG", category: "อาหารและเครื่องดื่ม", descriptiveHint: "วัตถุดิบที่ได้จากไก่ มักใช้ทำอาหารเช้า", pos: "(N.)", example: "I like my egg scrambled." },
            { word: "PIZZA", category: "อาหารและเครื่องดื่ม", descriptiveHint: "ขนมปังแผ่นกลมที่มีซอสมะเขือเทศและชีสอยู่ด้านบน", pos: "(N.)", example: "Let's order a large pizza for the party." },
            { word: "RAIN", category: "ธรรมชาติและภูมิศาสตร์", descriptiveHint: "น้ำที่ตกลงมาจากเมฆเป็นหยดๆ", pos: "(N.)", example: "I hope the rain stops before we leave." },
            { word: "RIVER", category: "ธรรมชาติและภูมิศาสตร์", descriptiveHint: "กระแสน้ำขนาดใหญ่ที่ไหลลงสู่ทะเลหรือทะเลสาบ", pos: "(N.)", example: "The town is located by the river." },
            { word: "SOFA", category: "บ้านและเฟอร์นิเจอร์", descriptiveHint: "ที่นั่งยาวนุ่มสำหรับหลายคน มักวางในห้องนั่งเล่น", pos: "(N.)", example: "The whole family can fit on the new sofa." },
            { word: "WINDOW", category: "บ้านและเฟอร์นิเจอร์", descriptiveHint: "ช่องกระจกที่มองเห็นภายนอกได้ ใช้ระบายอากาศและรับแสง", pos: "(N.)", example: "Open the window to let in some fresh air." },
            { word: "EAR", category: "ร่างกายมนุษย์", descriptiveHint: "อวัยวะที่ใช้ในการได้ยิน", pos: "(N.)", example: "He whispered the secret into my ear." },
            { word: "BRAIN", category: "ร่างกายมนุษย์", descriptiveHint: "อวัยวะหลักของการคิด การเรียนรู้ และความจำ", pos: "(N.)", example: "The human brain is highly complex." },
            { word: "CHEF", category: "อาชีพ", descriptiveHint: "หัวหน้าพ่อครัวมืออาชีพในร้านอาหาร", pos: "(N.)", example: "The restaurant hired a famous chef." },
            { word: "PILOT", category: "อาชีพ", descriptiveHint: "ผู้ที่บังคับเครื่องบิน", pos: "(N.)", example: "The pilot safely landed the plane in the storm." },
            { word: "BIG", category: "คำคุณศัพท์", descriptiveHint: "มีขนาดใหญ่ ตรงข้ามกับเล็ก", pos: "(Adj.)", example: "That is a very big house." },
            { word: "HAPPY", category: "คำคุณศัพท์", descriptiveHint: "รู้สึกยินดีหรือพอใจ", pos: "(Adj.)", example: "She was so happy to see her friends." },
            { word: "BOOK", category: "สุ่มรวมทุกหมวด", descriptiveHint: "ชุดของกระดาษที่พิมพ์แล้ว เย็บติดกัน ใช้สำหรับอ่าน", pos: "(N.)", example: "I finished reading a good book last night." },
        ];
        
        // --- HANGMAN SVG PARTS (IDs of the SVG elements to show) ---
        const hangmanSvgParts = [
            "head", "body", "left-arm", "right-arm", "left-leg", "right-leg", "left-eye", "right-eye"
        ];
        
        const MAX_LIVES = hangmanSvgParts.length; // Total wrong guesses allowed (8)
        
        // --- ELEMENTS ---
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        
        const categorySelection = document.getElementById('category-selection');
        const categoryTitleEl = document.getElementById('category-title');
        const livesLeftEl = document.getElementById('lives-left');
        const scoreEl = document.getElementById('score');
        
        const wordDisplay = document.getElementById('word-display');
        const keyboardEl = document.getElementById('keyboard');
        
        const hintMeaningDisplayEl = document.getElementById('hint-meaning-display'); 
        const hintExampleEl = document.getElementById('hint-example');
        const showHintBtn = document.getElementById('show-hint-btn'); 
        const giveUpBtn = document.getElementById('give-up-btn');
        
        const endMessageEl = document.getElementById('end-message');
        const endDetailsEl = document.getElementById('end-details');
        const finalWordRevealEl = document.getElementById('final-word-reveal');
        const finalMeaningRevealEl = document.getElementById('final-meaning-reveal');
        const finalPronounceBtn = document.getElementById('final-pronounce-btn'); 
        const restartBtn = document.getElementById('restart-btn');
        const backHomeBtn = document.getElementById('back-home-btn'); 
        

        // --- GAME STATE ---
        let lives = MAX_LIVES;
        let currentWord = '';
        let currentWordDetails = null;
        let guessedLetters = new Set();
        let currentCategory = '';
        let totalScore = 0; // Correct words in this session
        
        let wordQueue = []; // คิวคำศัพท์สำหรับเซสชั่นปัจจุบัน (กันซ้ำ)
        let currentWordIndex = 0; // ดัชนีคำศัพท์ในคิว
        let hintUsed = false; 

        // --- UTILITY (Hangman Draw) ---
        function drawHangman(livesLeft) {
            hangmanSvgParts.forEach(partId => {
                const part = document.getElementById(partId);
                if (part) part.style.display = 'none';
            });

            const partsLost = MAX_LIVES - livesLeft;
            for (let i = 0; i < partsLost; i++) {
                const part = document.getElementById(hangmanSvgParts[i]);
                if (part) part.style.display = 'block';
            }
        }
        
        // --- Core Helpers ---
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }
        
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(id).classList.add('active');
        }

        /* 3. การแก้ไข: ปรับปรุงฟังก์ชันการแสดงคำศัพท์โดยใช้ HTML Span สำหรับ Underline ที่แม่นยำ */
        function updateWordDisplay(revealFullWord = false) {
            let solved = true;
            const normalizedWord = currentWord.toUpperCase();
            wordDisplay.innerHTML = ''; 

            for (const letter of normalizedWord) {
                const span = document.createElement('span');
                span.classList.add('letter-slot');

                if (letter === ' ') {
                    span.textContent = ' ';
                    span.style.borderBottom = 'none'; 
                    span.style.minWidth = '1ch'; 
                } else if (revealFullWord || guessedLetters.has(letter)) {
                    span.textContent = letter;
                    span.classList.remove('placeholder');
                    span.style.borderBottom = '5px solid transparent'; 
                } else {
                    span.textContent = ' '; 
                    span.classList.add('placeholder');
                    span.style.borderBottom = '5px solid var(--color-primary)'; 
                    solved = false;
                }
                
                wordDisplay.appendChild(span);
            }
            return solved;
        }

        function generateKeyboard() {
            keyboardEl.innerHTML = '';
            for (let i = 65; i <= 90; i++) {
                const char = String.fromCharCode(i);
                const btn = document.createElement('button');
                btn.textContent = char;
                btn.className = 'key-btn';
                btn.setAttribute('data-char', char);
                
                // ตรวจสอบสถานะของปุ่มที่เคยถูกกด
                if (guessedLetters.has(char)) {
                    btn.disabled = true;
                    if (currentWord.includes(char)) {
                        btn.classList.add('correct');
                    } else {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.addEventListener('click', () => handleGuess(char));
                }
                keyboardEl.appendChild(btn);
            }
        }
        
        function updateKeyboard(char, isCorrect) {
            const btn = keyboardEl.querySelector(`[data-char="${char}"]`);
            if (btn) {
                btn.disabled = true;
                btn.classList.add(isCorrect ? 'correct' : 'wrong');
            }
        }

        function handleGuess(char) {
            const charUpper = char.toUpperCase();
            if (guessedLetters.has(charUpper)) return;

            guessedLetters.add(charUpper);
            
            if (currentWord.includes(charUpper)) {
                updateKeyboard(charUpper, true);
                const solved = updateWordDisplay();
                
                if (solved) {
                    // ปิดการใช้งานปุ่มทั้งหมดทันทีเพื่อรอการเปลี่ยนหน้าจอ
                    keyboardEl.querySelectorAll('.key-btn').forEach(btn => btn.disabled = true);
                    showHintBtn.disabled = true;
                    giveUpBtn.disabled = true;
                    endGame(true); // Win
                }
            } else {
                lives--;
                updateKeyboard(charUpper, false);
                drawHangman(lives);
                livesLeftEl.textContent = `โอกาส: ${lives}`;
                
                if (lives <= 0) {
                    // ปิดการใช้งานปุ่มทั้งหมดทันทีเพื่อรอการเปลี่ยนหน้าจอ
                    keyboardEl.querySelectorAll('.key-btn').forEach(btn => btn.disabled = true);
                    showHintBtn.disabled = true;
                    giveUpBtn.disabled = true;
                    
                    setTimeout(() => {
                         endGame(false); // Loss
                    }, 1000); 
                    
                    return; 
                }
            }
        }
        
        // --- GAME FLOW & UI ---

        function startSession(category) {
            currentCategory = category;
            
            // 1. กรองคำศัพท์ตามหมวดหมู่
            let availableWords;
            const randomCategoryName = "สุ่มรวมทุกหมวด";
            if (category === randomCategoryName) {
                availableWords = [...wordData];
            } else {
                availableWords = wordData.filter(d => d.category === category);
            }

            if (availableWords.length === 0) {
                alert("No words available for this category!");
                showScreen('start-screen');
                return;
            }

            wordQueue = [...availableWords];
            shuffle(wordQueue);
            currentWordIndex = 0;
            totalScore = 0;
            
            // การเปลี่ยนหน้าจอ
            showScreen('game-screen'); 

            loadNextWord(); 
        }
        
        function loadNextWord() {
            if (currentWordIndex >= wordQueue.length) {
                endSession(); 
                return;
            }
            
            // 1. Select the word
            currentWordDetails = wordQueue[currentWordIndex];
            currentWord = currentWordDetails.word.toUpperCase(); 

            // 2. Reset game state for this word
            lives = MAX_LIVES;
            guessedLetters.clear();
            hintUsed = false; 

            // 3. Update UI
            drawHangman(lives); 
            updateWordDisplay();
            generateKeyboard();
            
            categoryTitleEl.textContent = `หมวดหมู่: ${currentCategory}`;
            livesLeftEl.textContent = `โอกาส: ${lives}`;
            scoreEl.textContent = `คะแนน: ${totalScore}/${wordQueue.length}`;
            
            // 4. Update Hints 
            hintMeaningDisplayEl.textContent = currentWordDetails.descriptiveHint; 
            hintMeaningDisplayEl.style.display = 'none'; // ซ่อนข้อความ
            showHintBtn.style.display = 'inline-block'; // แสดงปุ่ม
            showHintBtn.disabled = false;
            
            // แทนที่คำศัพท์ด้วย ___ ในประโยคตัวอย่าง
            const blankedExample = currentWordDetails.example.replace(new RegExp(currentWordDetails.word, 'gi'), '___');
            hintExampleEl.textContent = blankedExample;
            
            // 5. Enable buttons
            giveUpBtn.disabled = false;
        }

        function endGame(isWin) {
            // 1. Reveal the full word (for display)
            updateWordDisplay(true); 
            
            // 2. Handle score and message
            if (isWin) {
                totalScore++;
                endMessageEl.textContent = "🥳 ยอดเยี่ยม! คุณชนะแล้ว!";
                endMessageEl.style.color = 'var(--color-correct)'; 
            } else {
                endMessageEl.textContent = "😭 น่าเสียดาย! คุณแพ้แล้ว!";
                endMessageEl.style.color = 'var(--color-wrong)'; 
            }
            endDetailsEl.textContent = `คะแนนรวมของเซสชั่น: ${totalScore}/${wordQueue.length} คำ`;
            
            // 3. Reveal final word details
            finalWordRevealEl.textContent = currentWordDetails.word;
            finalMeaningRevealEl.innerHTML = `(${currentWordDetails.pos}) ${currentWordDetails.descriptiveHint}.<br>ตัวอย่าง: ${currentWordDetails.example}`; 
            
            // 4. Check for next word / session end
            const hasNext = (currentWordIndex + 1) < wordQueue.length;
            
            if (hasNext) {
                restartBtn.textContent = `เล่นข้อต่อไป >> (${currentWordIndex + 1 + 1} / ${wordQueue.length})`;
                backHomeBtn.style.display = 'block'; 
            } else {
                restartBtn.textContent = "กลับหน้าหลัก"; 
                backHomeBtn.style.display = 'none'; 
            }
            
            showScreen('end-screen');
            // (Note: Removed auto-speech/auto-advance logic for simplicity)
        }

        // จัดการเมื่อเซสชั่นจบ
        function endSession() {
             wordQueue = []; 
             currentWordIndex = 0;
             showScreen('start-screen');
        }
        
        function setupCategoryButtons() {
            const allCategories = [...new Set(wordData.map(d => d.category))];

            categorySelection.innerHTML = '';
            
            allCategories.forEach(category => {
                // กรอง 'สุ่มรวมทุกหมวด' ออกก่อน เพื่อแสดงปุ่มแยก
                if (category === "สุ่มรวมทุกหมวด") return; 
                
                const count = wordData.filter(d => d.category === category).length;
                const btn = document.createElement('button');
                btn.className = 'main-btn';
                btn.textContent = `${category} (${count} คำ)`;
                btn.setAttribute('data-category', category);
                btn.addEventListener('click', () => startSession(category));
                categorySelection.appendChild(btn);
            });
            
            // Add "Random from ALL" button
            const totalWords = wordData.length;
            const randomCategoryName = "สุ่มรวมทุกหมวด";
            const randomBtn = document.createElement('button');
            randomBtn.className = 'main-btn btn-random';
            randomBtn.textContent = `${randomCategoryName} (All Words Mix: ${totalWords} คำ)`;
            
            randomBtn.addEventListener('click', () => startSession(randomCategoryName)); 
            
            categorySelection.appendChild(randomBtn);
        }


        // --- EVENT LISTENERS ---
        
        finalPronounceBtn.addEventListener('click', () => {
             // Logic for pronunciation (needs external library or Web Speech API setup)
             alert(`Pronouncing: ${currentWordDetails.word}`);
        });
        
        showHintBtn.addEventListener('click', () => {
            if (!hintUsed && currentWordDetails) {
                hintMeaningDisplayEl.style.display = 'inline'; // แสดงข้อความคำใบ้
                showHintBtn.style.display = 'none'; // ซ่อนปุ่ม
                hintUsed = true;
            }
        });

        giveUpBtn.addEventListener('click', () => {
            drawHangman(0); 
            livesLeftEl.textContent = `โอกาส: 0`;
            
            keyboardEl.querySelectorAll('.key-btn').forEach(btn => btn.disabled = true);
            showHintBtn.disabled = true;
            giveUpBtn.disabled = true;

            setTimeout(() => {
                endSession(); 
            }, 1000); 
        });
        
        backHomeBtn.addEventListener('click', () => {
            endSession();
        });


        restartBtn.addEventListener('click', () => {
             currentWordIndex++; 

             if (currentWordIndex < wordQueue.length) {
                 showScreen('game-screen'); 
                 loadNextWord();
             } else {
                 // End of session, redirect to home
                 endSession();
             }
        });

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            setupCategoryButtons();
            drawHangman(MAX_LIVES); 
        });
    </script>
</body>
</html>
